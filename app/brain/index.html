<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>第二大腦 · 捕捉與連結</title>
<meta name="description" content="靈光乍現隨手捕捉，煉成卡片、用 [[雙向連結]] 連成一張知識網，一個搜尋框翻遍全部。電腦雙欄多工、手機隨手記。">
<meta name="theme-color" content="#4b3fc4">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="第二大腦">
<style>
  :root{
    --paper:#f4f3fa; --surface:#ffffff; --panel:#f6f5fc; --raise:#ffffff;
    --ink:#1b1830; --ink-soft:#565073; --ink-mute:#8b86a4;
    --line:#e5e2f0; --dot:#d3cdea;
    --accent:#5b4ee0; --accent-d:#4a3fc4; --accent-soft:#ece9ff;
    --tag:#0e8f80; --tag-soft:#d6f3ee; --gold:#a9791a; --danger:#d64545;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
    --shadow:0 12px 30px rgba(27,24,48,.12); --shadow-sm:0 2px 9px rgba(27,24,48,.08);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#0e0d16; --surface:#181626; --panel:#141221; --raise:#1e1b2e;
      --ink:#eee9f7; --ink-soft:#b1abc7; --ink-mute:#7c7794;
      --line:rgba(255,255,255,.09); --dot:rgba(255,255,255,.09);
      --accent:#9a8dff; --accent-d:#8072f0; --accent-soft:rgba(154,141,255,.16);
      --tag:#2ec4b2; --tag-soft:rgba(46,196,178,.16); --gold:#e6b34d; --danger:#ff6b6b;
      --shadow:0 16px 40px rgba(0,0,0,.5); --shadow-sm:0 2px 12px rgba(0,0,0,.34);
    }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:var(--paper);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
  button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  .mono{font-family:var(--mono)}
  ::selection{background:var(--accent-soft)}
  input:focus,textarea:focus{outline:none}

  /* top bar */
  .top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 90%,transparent);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
  .top .in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:10px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15px;flex:0 0 auto}
  .brand .bx{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#7b6bff,#4b3fc4);
    display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px}
  .brand .nm{display:none}
  .search{flex:1;display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);
    border-radius:11px;padding:8px 12px;max-width:560px}
  .search input{flex:1;border:none;background:none;font-size:14px}
  .search .ic{color:var(--ink-mute);font-size:14px}
  .hubline{margin-left:auto;font-size:13px;font-weight:700;color:var(--ink-mute);text-decoration:none;flex:0 0 auto}
  .hubline:hover{color:var(--accent)}

  /* workspace shell */
  #app{max-width:1240px;margin:0 auto;padding:16px}
  @media(min-width:900px){
    #app{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start;padding:20px 24px 40px}
    .pane-list{position:sticky;top:78px;max-height:calc(100vh - 96px);overflow-y:auto;padding-right:2px}
    body.wideview #app{grid-template-columns:1fr}
    body.wideview .pane-detail{display:none}
    body.wideview .pane-list{position:static;max-height:none;overflow:visible}
  }
  @media(max-width:899px){
    #app{padding-bottom:calc(env(safe-area-inset-bottom) + 96px)}
    .pane-detail{display:none}
    body.detail .pane-list{display:none}
    body.detail .pane-detail{display:block}
  }

  /* capture */
  .capture{background:var(--raise);border:1px solid var(--line);border-radius:15px;padding:13px;box-shadow:var(--shadow-sm);
    margin-bottom:14px;position:relative}
  .capture::before{content:"⚡";position:absolute;left:15px;top:14px;font-size:15px}
  .capture textarea{width:100%;border:none;background:none;resize:none;font-size:15.5px;line-height:1.6;
    min-height:24px;max-height:200px;padding:2px 0 2px 26px}
  .capture textarea::placeholder{color:var(--ink-mute)}
  .capture .cbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding-left:26px}
  .capture .hint{font-size:11px;color:var(--ink-mute)}
  .capture .hint b{color:var(--ink-soft)}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;font-weight:800;font-size:14px;
    background:var(--surface);border:1px solid var(--line);color:var(--ink);transition:.14s}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;border-color:transparent}
  .btn.sm{padding:7px 11px;font-size:13px}
  .btn.ghost{background:transparent;box-shadow:none}
  .btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}

  /* autocomplete */
  .ac{position:relative}
  .acbox{position:absolute;left:26px;right:6px;z-index:50;background:var(--raise);border:1px solid var(--line);
    border-radius:11px;box-shadow:var(--shadow);overflow:hidden;margin-top:2px;display:none}
  .acbox.show{display:block}
  .acbox .it{display:block;width:100%;text-align:left;padding:9px 13px;font-size:13.5px;border-bottom:1px solid var(--line)}
  .acbox .it:last-child{border-bottom:none}
  .acbox .it.on,.acbox .it:hover{background:var(--accent-soft)}
  .acbox .it .new{color:var(--ink-mute);font-size:12px}

  /* filter chips */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .chip{font-size:13px;font-weight:800;padding:6px 12px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink-soft);display:inline-flex;gap:6px;align-items:center}
  .chip.on{background:var(--accent);color:#fff;border-color:transparent}
  .chip .ct{font-family:var(--mono);font-size:11px;opacity:.8}
  .chip.tag{color:var(--tag)} .chip.tag.on{background:var(--tag);color:#fff}

  /* notes list */
  .list{display:flex;flex-direction:column;gap:10px}
  @media(max-width:899px){.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}}
  .note{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 14px;
    box-shadow:var(--shadow-sm);transition:.12s;display:flex;flex-direction:column;gap:7px;width:100%}
  .note:hover{border-color:var(--accent)}
  .note.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .note.inbox{border-left:3px solid var(--gold)}
  .note .nt{font-weight:850;font-size:14.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .note .nb{font-size:12px;color:var(--ink-soft);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
  .note .nf{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;align-items:center}
  .tagchip{font-size:11px;font-weight:700;color:var(--tag);background:var(--tag-soft);border-radius:6px;padding:2px 7px}
  .lkcount{font-family:var(--mono);font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px}
  .note .nd{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);margin-left:auto}

  .empty{text-align:center;padding:40px 20px;color:var(--ink-mute)}
  .empty .big{font-size:40px;margin-bottom:8px}
  .empty p{font-size:14px;max-width:400px;margin:0 auto}

  /* detail */
  .back{margin-bottom:12px}
  @media(min-width:900px){.back{display:none}}
  .detail{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:visible}
  .detail .edit{width:100%;border:none;background:none;resize:none;min-height:200px;padding:22px 22px 6px;
    font-size:16px;line-height:1.8;color:var(--ink)}
  .detail .meta{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;border-top:1px solid var(--line);
    font-family:var(--mono);font-size:11px;color:var(--ink-mute);flex-wrap:wrap}
  .detail .meta .acts{display:flex;gap:8px}
  .preview{padding:14px 22px 20px}
  .preview .pl{font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--ink-mute);text-transform:uppercase;margin-bottom:8px}
  .preview .pv{font-size:15px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
  .wl{color:var(--accent);font-weight:700;cursor:pointer;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
  .wl.new{color:var(--ink-mute);border-bottom-style:dashed}
  .ht{color:var(--tag);font-weight:700;cursor:pointer}
  .section-t{font-size:12px;font-weight:800;letter-spacing:.05em;color:var(--ink-mute);text-transform:uppercase;margin:20px 0 10px}
  .backlinks{display:flex;flex-direction:column;gap:9px}
  .bl{text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
  .bl:hover{border-color:var(--accent)}
  .bl .blt{font-weight:800;font-size:14px}
  .bl .blb{font-size:12px;color:var(--ink-soft);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .none{font-size:13px;color:var(--ink-mute);padding:4px 0}
  .ph{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--ink-mute);
    min-height:320px;border:1px dashed var(--line);border-radius:16px;padding:30px;background:var(--panel)}
  .ph .big{font-size:40px;margin-bottom:10px}

  /* fab (mobile only) */
  .fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:40;
    width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;
    font-size:25px;display:grid;place-items:center;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 50%,transparent)}
  @media(min-width:900px){.fab{display:none}}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%) translateY(80px);
    background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:24px;font-size:13.5px;font-weight:700;
    box-shadow:var(--shadow);z-index:80;opacity:0;transition:.25s}
  .toast.show{transform:translateX(-50%);opacity:1}
  @media(min-width:520px){.brand .nm{display:inline}}

  /* sync button + sheet */
  .syncbtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;
    padding:7px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink-mute)}
  .syncbtn.on{color:var(--tag);border-color:color-mix(in srgb,var(--tag) 40%,var(--line))}
  .syncbtn .d{width:8px;height:8px;border-radius:50%;background:currentColor}
  .modal{position:fixed;inset:0;z-index:70;display:none;align-items:flex-end;justify-content:center;background:rgba(15,14,23,.5);backdrop-filter:blur(3px)}
  .modal.show{display:flex}
  .sheet{background:var(--surface);width:100%;max-width:540px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;
    box-shadow:var(--shadow);padding:22px 20px calc(env(safe-area-inset-bottom) + 20px)}
  @media(min-width:600px){.modal{align-items:center}.sheet{border-radius:20px}}
  .sheet h3{font-size:19px;font-weight:850;margin-bottom:6px}
  .sheet p{font-size:13.5px;color:var(--ink-soft);margin-bottom:12px}
  .sheet ol{margin:0 0 14px 20px;font-size:13.5px;color:var(--ink-soft)} .sheet li{margin:5px 0}
  .sheet textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:11px;padding:11px 13px;
    background:var(--paper);font-family:var(--mono);font-size:12px;line-height:1.5;resize:vertical}
  .sheet .foot{display:flex;gap:10px;margin-top:14px}
  .sheet .foot .btn{flex:1;justify-content:center}
  .statusline{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:14px;font-weight:700}
  /* tasks (Jocko 總清單) */
  .captoggle{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--ink-mute);cursor:pointer;user-select:none}
  .captoggle input{accent-color:var(--accent);width:15px;height:15px}
  .captoggle.on{color:var(--accent)}
  .tasks{display:flex;flex-direction:column;gap:9px}
  .tfirst{background:linear-gradient(135deg,var(--accent-soft),var(--surface));border:1px solid color-mix(in srgb,var(--accent) 32%,var(--line));border-radius:15px;padding:4px 8px 10px;margin-bottom:12px}
  .tfirst .lead{font-size:12px;font-weight:900;color:var(--accent);padding:9px 6px 6px}
  .trow{display:flex;align-items:flex-start;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
  .trow:hover{border-color:var(--accent)}
  .tchk{width:22px;height:22px;flex:0 0 auto;border-radius:50%;border:2px solid var(--ink-mute);display:grid;place-items:center;color:#fff;font-size:13px;margin-top:1px;background:none}
  .trow.done .tchk{background:var(--tag);border-color:var(--tag)}
  .tbody{flex:1;min-width:0;cursor:pointer}
  .tbody .tt{font-weight:800;font-size:15px;line-height:1.4}
  .trow.done .tt{color:var(--ink-mute);text-decoration:line-through}
  .tbody .tm{font-size:12px;color:var(--ink-mute);margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .pdot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;margin-top:6px}
  .p1{background:#e0517a} .p2{background:#e0a82e} .p3{background:#8b86a4}
  .taskctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 22px 4px;font-size:13px;color:var(--ink-soft);border-top:1px solid var(--line)}
  .taskctl .tb{font-weight:800;padding:6px 11px;border-radius:9px;border:1px solid var(--line);color:var(--ink-soft)}
  .taskctl .tb.act{background:var(--accent);color:#fff;border-color:transparent}
  .prio-pick{display:inline-flex;gap:5px}
  .prio-pick button{font-size:12.5px;font-weight:800;padding:5px 10px;border-radius:8px;border:1px solid var(--line);color:var(--ink-soft)}
  .prio-pick button.on.p1{background:#e0517a;color:#fff;border-color:transparent}
  .prio-pick button.on.p2{background:#e0a82e;color:#fff;border-color:transparent}
  .prio-pick button.on.p3{background:#8b86a4;color:#fff;border-color:transparent}
  /* due badge + calendar */
  .duebadge{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--panel);border:1px solid var(--line);color:var(--ink-mute);margin-left:6px}
  .duebadge.today{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
  .duebadge.over{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
  .calnav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .calnav button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:900;color:var(--accent);font-size:18px}
  .calnav .lab{font-weight:800;font-size:15px}
  .calnav .today{width:auto;padding:0 13px;font-size:13px;height:36px}
  .week{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
  @media(min-width:900px){.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:start}}
  .day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 11px;min-height:64px}
  .day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .day.past{opacity:.65}
  .dh{font-size:13px;font-weight:800;margin-bottom:7px;display:flex;gap:6px;align-items:center}
  .todaytag{font-size:10px;background:var(--accent);color:#fff;border-radius:6px;padding:1px 6px}
  .dayempty{color:var(--ink-mute);font-size:12px}
  .caltask{display:flex;align-items:center;gap:8px;padding:5px 0}
  .caltask .cc{width:18px;height:18px;flex:0 0 auto;border-radius:50%;border:2px solid var(--ink-mute);display:grid;place-items:center;color:#fff;font-size:11px;background:none}
  .caltask.done .cc{background:var(--tag);border-color:var(--tag)}
  .caltask .ct2{flex:1;min-width:0;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .caltask.done .ct2{color:var(--ink-mute);text-decoration:line-through}
  .caltask .calx{color:var(--ink-mute);font-size:15px;padding:0 3px;flex:0 0 auto}
  .qbtn{font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:8px;border:1px solid var(--line);color:var(--ink-soft);background:var(--surface)}
  .qbtn:hover{border-color:var(--accent);color:var(--accent)}
  .unsched{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px}
  .unsched .ut{flex:1 1 140px;min-width:0;font-size:13.5px;font-weight:700;cursor:pointer}
  .duectl{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:8px 22px 12px}
  .duectl input[type=date]{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--paper);font-size:13px}
  .morelinks{display:grid;gap:8px;margin-bottom:6px}
  .mlink{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 13px;text-decoration:none;color:var(--ink);font-weight:800;font-size:14.5px}
  .mlink span{font-weight:600;font-size:12px;color:var(--ink-mute);margin-top:2px}
  .mlink:hover{border-color:var(--accent)}
  .outbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .outbar .ol{font-size:12.5px;font-weight:800;color:var(--ink-soft)}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="top"><div class="in">
  <div class="brand" onclick="brandHome()" style="cursor:pointer"><span class="bx">腦</span><span class="nm">第二大腦</span></div>
  <div class="search"><span class="ic">🔍</span><input id="q" placeholder="搜尋所有卡片（標題、內容、#標籤）…"></div>
  <button class="syncbtn" id="syncBtn" title="跨裝置同步"><span class="d"></span><span id="syncLbl">同步</span></button>
  <button class="syncbtn" id="moreBtn" title="更多工具與備份">☰</button>
</div></div>

<div id="app">
  <aside class="pane-list" id="paneList"></aside>
  <main class="pane-detail" id="paneDetail"></main>
</div>

<button class="fab" id="fab" title="快速捕捉">⚡</button>
<div class="toast" id="toast"></div>
<div class="modal" id="syncModal"></div>
<div class="modal" id="moreModal"></div>

<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const LS='brain.data.v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmt=ts=>{const d=new Date(ts);return `${d.getMonth()+1}/${pad(d.getDate())}`;};
const isWide=()=>window.matchMedia('(min-width:900px)').matches;

let data={notes:[]};
try{const d=JSON.parse(localStorage.getItem(LS));if(d&&Array.isArray(d.notes))data=d;}catch(e){}
let st={id:null, filter:'inbox', tag:'', q:'', capTask:false, weekOff:0};
let saveT;
function save(){localStorage.setItem(LS,JSON.stringify(data));}
function toast(m){const t=$('#toast');t.textContent=m;t.className='toast show';clearTimeout(saveT);saveT=setTimeout(()=>t.className='toast',1300);}

/* ---------- derive ---------- */
const liveNotes=()=>data.notes.filter(n=>!n.deleted);
const note=id=>data.notes.find(n=>n.id===id&&!n.deleted);
const titleOf=n=>{const t=(n.body||'').trim().split(/\n/)[0].trim();return t||'（無標題）';};
const norm=s=>String(s||'').trim().toLowerCase();
function tagsOf(n){const m=(n.body||'').match(/#([^\s#\[\]]+)/g)||[];return [...new Set(m.map(x=>x.slice(1)))];}
function linkTitlesOf(n){const m=(n.body||'').match(/\[\[([^\]]+)\]\]/g)||[];return [...new Set(m.map(x=>x.slice(2,-2).trim()))];}
const noteByTitle=t=>liveNotes().find(n=>norm(titleOf(n))===norm(t));
function backlinks(n){const t=norm(titleOf(n));return liveNotes().filter(m=>m.id!==n.id&&linkTitlesOf(m).some(x=>norm(x)===t));}
function allTags(){const c={};liveNotes().forEach(n=>tagsOf(n).forEach(t=>c[t]=(c[t]||0)+1));return Object.entries(c).sort((a,b)=>b[1]-a[1]);}

function capture(text,keep,isTask){
  const body=text.trim();if(!body)return null;
  const n={id:uid(),body,status:(keep||isTask)?'kept':'inbox',deleted:false,createdAt:Date.now(),updatedAt:Date.now()};
  if(isTask){n.isTask=true;n.prio=2;n.taskDone=false;}
  data.notes.unshift(n);save();pushNote(n);return n;
}

/* ---------- render ---------- */
function render(){
  $('#paneList').innerHTML=listHtml();
  $('#paneDetail').innerHTML=st.id?detailHtml():placeholderHtml();
  document.body.classList.toggle('detail', !!st.id && !isWide());
  document.body.classList.toggle('wideview', st.filter==='cal' && !st.id && !st.q && !st.tag);
  bind();
}
function filteredNotes(){
  const q=norm(st.q);
  let notes=liveNotes();
  if(q)notes=notes.filter(n=>norm(n.body).includes(q));
  else if(st.tag)notes=notes.filter(n=>tagsOf(n).some(t=>norm(t)===norm(st.tag)));
  else if(st.filter==='inbox')notes=notes.filter(n=>n.status==='inbox');
  return notes.sort((a,b)=>b.updatedAt-a.updatedAt);
}
function listHtml(){
  const inboxN=liveNotes().filter(n=>n.status==='inbox').length;
  const totalN=liveNotes().length;
  const cap=`<div class="capture ac">
    <textarea id="cap" rows="1" placeholder="⚡ 靈光乍現？丟進來… 第一行是標題。#標籤 分類、[[標題]] 連到別張卡。Enter 捕捉"></textarea>
    <div class="acbox" id="ac-cap"></div>
    <div class="cbar">
      <label class="captoggle ${st.capTask?'on':''}"><input type="checkbox" id="capTask" ${st.capTask?'checked':''}> 🎯 當任務</label>
      <button class="btn primary sm" id="capBtn">${st.capTask?'加入清單':'捕捉'}</button>
    </div>
  </div>`;
  let chips;
  const q=norm(st.q);
  if(st.q){chips=`<div class="chips"><span class="chip on">🔍 ${esc(st.q)}</span><button class="chip" onclick="clearQ()">✕</button></div>`;}
  else{
    const tags=allTags().slice(0,10).map(([t,c])=>`<button class="chip tag ${st.tag===t?'on':''}" onclick="setTag('${esc(t)}')">#${esc(t)} <span class="ct">${c}</span></button>`).join('');
    const taskN=liveNotes().filter(n=>n.isTask&&!n.taskDone).length;
    chips=`<div class="chips">
      <button class="chip ${st.filter==='inbox'&&!st.tag?'on':''}" onclick="setFilter('inbox')">⚡ 收件匣 <span class="ct">${inboxN}</span></button>
      <button class="chip ${st.filter==='task'&&!st.tag?'on':''}" onclick="setFilter('task')">🎯 總清單 <span class="ct">${taskN}</span></button>
      <button class="chip ${st.filter==='cal'&&!st.tag?'on':''}" onclick="setFilter('cal')">📅 行事曆</button>
      <button class="chip ${st.filter==='all'&&!st.tag?'on':''}" onclick="setFilter('all')">🗂️ 全部 <span class="ct">${totalN}</span></button>
      ${tags}</div>`;
  }
  let body;
  if(st.filter==='task'&&!st.q&&!st.tag){return cap+chips+taskListHtml();}
  if(st.filter==='cal'&&!st.q&&!st.tag){return cap+chips+calHtml();}
  const notes=filteredNotes();
  if(!totalN){
    body=`<div class="empty"><div class="big">🧠</div><p>這是你的第二大腦。<b>有想法先丟上面的框</b>——不用分類、不用完整，之後再連結整理。</p>
      <p style="margin-top:12px"><button class="btn" onclick="seedBrain()">看個範例</button></p></div>`;
  }else if(!notes.length){
    body=`<div class="empty"><div class="big">✨</div><p>${st.q?'沒有符合的卡片。':st.tag?`#${esc(st.tag)} 底下還沒有卡片。`:'收件匣清空了！切到「全部」看所有卡片。'}</p></div>`;
  }else{
    body=`<div class="list">${notes.map(noteCard).join('')}</div>`;
  }
  const outbar=st.tag?`<div class="outbar"><span class="ol">#${esc(st.tag)}（${notes.length}）依類型輸出：</span><button class="qbtn" onclick="aiType()">🤖 整理給 AI</button><button class="qbtn" onclick="dlType()">📄 匯出 .md</button></div>`:'';
  return cap+chips+outbar+body;
}
function noteCard(n){
  const tags=tagsOf(n).slice(0,3).map(t=>`<span class="tagchip">#${esc(t)}</span>`).join('');
  const tot=linkTitlesOf(n).length+backlinks(n).length;
  const rest=(n.body||'').trim().split(/\n/).slice(1).join('\n').trim();
  return `<button class="note ${n.status==='inbox'?'inbox':''} ${n.id===st.id?'on':''}" onclick="openNote('${n.id}')">
    <div class="nt">${esc(titleOf(n))}</div>
    ${rest?`<div class="nb">${esc(rest)}</div>`:''}
    <div class="nf">${tags}${tot?`<span class="lkcount">🔗 ${tot}</span>`:''}<span class="nd">${fmt(n.updatedAt)}</span></div>
  </button>`;
}
function taskListHtml(){
  const open=liveNotes().filter(n=>n.isTask&&!n.taskDone).sort((a,b)=>(a.prio||2)-(b.prio||2)||b.updatedAt-a.updatedAt);
  const done=liveNotes().filter(n=>n.isTask&&n.taskDone).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  if(!open.length&&!done.length)
    return `<div class="empty"><div class="big">🎯</div><p><b>總清單是空的。</b>捕捉時勾「🎯 當任務」，或在任一張卡按「設為任務」。</p>
      <p style="margin-top:10px;font-size:12.5px">Jocko 的方法：任務全寫進這一個地方 → 依優先度排好 → 早上先解決第一件。就這樣。</p></div>`;
  let html='';
  if(open.length){
    const first=open[0],rest=open.slice(1);
    html+=`<div class="tfirst"><div class="lead">🔥 先做這一件</div>${taskRow(first)}</div>`;
    if(rest.length)html+=`<div class="tasks">${rest.map(taskRow).join('')}</div>`;
  }else{
    html+=`<div class="empty" style="padding:26px"><div class="big">🎉</div><p>開放任務都清光了，做得好！</p></div>`;
  }
  if(done.length)html+=`<div class="section-t">已完成 · ${done.length}</div><div class="tasks">${done.map(taskRow).join('')}</div>`;
  return html;
}
function taskRow(n){
  const p=n.prio||2, pl={1:'高',2:'中',3:'低'}[p];
  const rest=(n.body||'').split('\n').slice(1).join(' ').trim();
  return `<div class="trow ${n.taskDone?'done':''}">
    <button class="tchk" onclick="toggleTaskDone('${n.id}')" title="${n.taskDone?'標為未完成':'完成'}">${n.taskDone?'✓':''}</button>
    <div class="tbody" onclick="openNote('${n.id}')"><div class="tt">${esc(titleOf(n))}${n.due?`<span class="duebadge ${dueClass(n.due)}">${dueLabel(n.due)}</span>`:''}</div>
      <div class="tm">優先：${pl}${rest?' · '+esc(rest):''}</div></div>
    <span class="pdot p${p}" title="優先度"></span></div>`;
}
function setTask(id,on){const n=note(id);if(!n)return;n.isTask=on;if(on){if(!n.prio)n.prio=2;if(n.status==='inbox')n.status='kept';}n.updatedAt=Date.now();save();pushNote(n);render();}
function setPrio(id,p){const n=note(id);if(!n)return;n.prio=p;n.updatedAt=Date.now();save();pushNote(n);render();}
function toggleTaskDone(id){const n=note(id);if(!n)return;n.taskDone=!n.taskDone;n.doneAt=n.taskDone?Date.now():null;n.updatedAt=Date.now();save();pushNote(n);render();}
/* ---- 到期日 / 行事曆 ---- */
function isoOf(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function todayISO(){return isoOf(new Date());}
function addDaysISO(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return isoOf(d);}
const WDN=['日','一','二','三','四','五','六'];
function dueLabel(due){if(!due)return '';const t=todayISO();if(due<t)return '逾期';if(due===t)return '今天';if(due===addDaysISO(t,1))return '明天';const d=new Date(due+'T00:00:00');return `${d.getMonth()+1}/${d.getDate()}（${WDN[d.getDay()]}）`;}
function dueClass(due){if(!due)return '';const t=todayISO();if(due<t)return 'over';if(due===t)return 'today';return '';}
function setDue(id,iso){const n=note(id);if(!n)return;n.due=iso||null;if(iso&&!n.isTask){n.isTask=true;if(!n.prio)n.prio=2;n.taskDone=false;if(n.status==='inbox')n.status='kept';}n.updatedAt=Date.now();save();pushNote(n);render();}
function calWeek(n,reset){st.weekOff=reset?0:st.weekOff+n;render();}
function weekDays(){const base=new Date();base.setHours(0,0,0,0);const dow=(base.getDay()+6)%7;
  const mon=new Date(base);mon.setDate(base.getDate()-dow+st.weekOff*7);
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return isoOf(d);});}
function calHtml(){
  const days=weekDays(),t=todayISO();
  const tasks=liveNotes().filter(n=>n.isTask&&!n.taskDone);
  const unsched=tasks.filter(n=>!n.due).sort((a,b)=>(a.prio||2)-(b.prio||2)||b.updatedAt-a.updatedAt);
  const wl=`${days[0].slice(5).replace('-','/')} – ${days[6].slice(5).replace('-','/')}`;
  let html=`<div class="calnav"><button onclick="calWeek(-1)">‹</button><div class="lab">${st.weekOff===0?'本週':(st.weekOff>0?'+'+st.weekOff+' 週':st.weekOff+' 週')} ${wl}</div><button onclick="calWeek(1)">›</button><button class="today" onclick="calWeek(0,true)">今天</button></div><div class="week">`;
  days.forEach(iso=>{const d=new Date(iso+'T00:00:00');
    const dt=tasks.filter(n=>n.due===iso).sort((a,b)=>(a.prio||2)-(b.prio||2));
    html+=`<div class="day ${iso===t?'today':''} ${iso<t?'past':''}"><div class="dh"><b>週${WDN[d.getDay()]}</b> ${d.getMonth()+1}/${d.getDate()} ${iso===t?'<span class="todaytag">今天</span>':''}</div>
      ${dt.length?dt.map(n=>`<div class="caltask ${n.taskDone?'done':''}"><button class="cc" onclick="toggleTaskDone('${n.id}')">${n.taskDone?'✓':''}</button><span class="ct2" onclick="openNote('${n.id}')">${esc(titleOf(n))}</span><button class="calx" onclick="clearDue('${n.id}')" title="移出行事曆">×</button></div>`).join(''):'<div class="dayempty">—</div>'}</div>`;});
  html+='</div>';
  html+=`<div class="section-t">未排程 · ${unsched.length}</div>`;
  html+= unsched.length? unsched.map(n=>`<div class="unsched"><span class="ut" onclick="openNote('${n.id}')">${esc(titleOf(n))}</span>
      <button class="qbtn" onclick="setDue('${n.id}','${t}')">今天</button>
      <button class="qbtn" onclick="setDue('${n.id}','${addDaysISO(t,1)}')">明天</button>
      <button class="qbtn" onclick="openNote('${n.id}')">選日期…</button></div>`).join('')
      : '<div class="none">開放任務都排進行事曆了 👍</div>';
  return html;
}
function clearDue(id){setDue(id,null);}
function placeholderHtml(){
  return `<div class="ph"><div class="big">🔗</div>
    <div style="font-weight:800;color:var(--ink-soft);margin-bottom:4px">選一張卡開始，或在左邊捕捉新想法</div>
    <div style="font-size:13px">電腦上左邊清單、右邊編輯，可以同時看、快速切換。<br>打 <b class="mono">[[</b> 會跳出卡片建議，方便連結。</div></div>`;
}
function detailHtml(){
  const n=note(st.id);if(!n)return placeholderHtml();
  const bl=backlinks(n);
  return `<button class="btn ghost sm back" onclick="goHome()">← 返回清單</button>
    <div class="detail ac">
      <textarea class="edit" id="ed" placeholder="第一行＝標題，接著寫內容。#標籤 · [[連到別張卡]]">${esc(n.body)}</textarea>
      <div class="acbox" id="ac-ed"></div>
      <div class="preview"><div class="pl">預覽（可點連結與標籤）</div><div class="pv" id="pv">${renderBody(n)}</div></div>
      <div class="taskctl">
        <button class="tb ${n.isTask?'act':''}" onclick="setTask('${n.id}',${n.isTask?'false':'true'})">${n.isTask?'🎯 任務中':'🎯 設為任務'}</button>
        ${n.isTask?`<span>優先</span><span class="prio-pick">${[1,2,3].map(p=>`<button class="p${p} ${(n.prio||2)===p?'on':''}" onclick="setPrio('${n.id}',${p})">${({1:'高',2:'中',3:'低'})[p]}</button>`).join('')}</span>
        <button class="tb" onclick="toggleTaskDone('${n.id}')">${n.taskDone?'↩ 標未完成':'✓ 完成'}</button>`:''}
      </div>
      ${n.isTask?`<div class="duectl"><span style="font-weight:800">到期</span>
        <input type="date" value="${n.due||''}" onchange="setDue('${n.id}',this.value)">
        <button class="qbtn" onclick="setDue('${n.id}','${todayISO()}')">今天</button>
        <button class="qbtn" onclick="setDue('${n.id}','${addDaysISO(todayISO(),1)}')">明天</button>
        ${n.due?`<button class="qbtn" onclick="clearDue('${n.id}')">清除</button><span class="duebadge ${dueClass(n.due)}">${dueLabel(n.due)}</span>`:''}
      </div>`:''}
      <div class="meta">
        <span>建立 ${new Date(n.createdAt).toLocaleString('zh-TW',{hour12:false}).slice(0,16)}</span>
        <span class="acts">
          <button class="btn ghost sm" onclick="toggleKeep('${n.id}')">${n.status==='inbox'?'✓ 移出收件匣':'↩ 收回收件匣'}</button>
          <button class="btn ghost sm danger" onclick="delNote('${n.id}')">刪除</button>
        </span>
      </div>
    </div>
    <div class="section-t">🔗 反向連結 · ${bl.length}（哪些卡連到這張）</div>
    ${bl.length?`<div class="backlinks">${bl.map(m=>`<button class="bl" onclick="openNote('${m.id}')"><div class="blt">${esc(titleOf(m))}</div><div class="blb">${esc((m.body||'').replace(/\n/g,' '))}</div></button>`).join('')}</div>`:`<div class="none">還沒有卡連過來。在別張卡打 [[${esc(titleOf(n))}]] 就會出現在這裡。</div>`}`;
}
function renderBody(n){
  let h=esc(n.body||'');
  h=h.replace(/\[\[([^\]]+)\]\]/g,(m,t)=>{const title=t.trim();const hit=noteByTitle(title);
    return `<span class="wl ${hit?'':'new'}" onclick="openTitle('${esc(title).replace(/'/g,"\\'")}')">[[${esc(title)}]]</span>`;});
  h=h.replace(/#([^\s#\[\]<]+)/g,(m,t)=>`<span class="ht" onclick="setTag('${esc(t).replace(/'/g,"\\'")}')">#${esc(t)}</span>`);
  return h;
}

/* ---------- actions ---------- */
function doCapture(){const ta=$('#cap');if(!ta)return;const isTask=!!(($('#capTask')||{}).checked)||st.capTask;
  const n=capture(ta.value,false,isTask);if(!n){ta.focus();return;}
  ta.value='';toast(isTask?'已加入總清單 🎯':'已捕捉 ⚡');render();const c=$('#cap');if(c)c.focus();}
function openNote(id){st.id=id;render();if(!isWide())window.scrollTo({top:0,behavior:'auto'});}
function goHome(){st.id=null;render();}
function openTitle(title){let n=noteByTitle(title);if(!n){n=capture(title,true);toast('已建立新卡片 ✓');}st.id=n.id;render();}
function setFilter(f){st.filter=f;st.tag='';st.q='';$('#q').value='';render();}
function setTag(t){st.tag=t;st.q='';$('#q').value='';render();if(!isWide())window.scrollTo({top:0,behavior:'auto'});}
function clearQ(){st.q='';$('#q').value='';render();}
function toggleKeep(id){const n=note(id);if(n){n.status=n.status==='inbox'?'kept':'inbox';n.updatedAt=Date.now();save();pushNote(n);render();}}
function delNote(id){if(!confirm('刪除這張卡片？'))return;const n=note(id);if(n){n.deleted=true;n.updatedAt=Date.now();save();pushNote(n);}goHome();toast('已刪除');}

/* ---------- autocomplete for [[ ---------- */
function acState(){return {ta:null,box:null,items:[],idx:0,open:false};}
let AC={cap:acState(),ed:acState()};
function partialLink(ta){const pos=ta.selectionStart;const up=ta.value.slice(0,pos);const m=up.match(/\[\[([^\[\]\n]*)$/);return m?m[1]:null;}
function updateAC(which){
  const A=AC[which];if(!A.ta||!A.box)return;
  const q=partialLink(A.ta);
  if(q===null){closeAC(which);return;}
  const nq=norm(q);
  let matches=data.notes.filter(n=>titleOf(n)!=='（無標題）'&&norm(titleOf(n)).includes(nq)).slice(0,8);
  A.items=matches.map(n=>titleOf(n));
  const exact=matches.some(n=>norm(titleOf(n))===nq);
  let html=matches.map((n,i)=>`<button class="it ${i===0?'on':''}" data-i="${i}" data-t="${esc(titleOf(n))}">${esc(titleOf(n))}</button>`).join('');
  if(q.trim()&&!exact){html+=`<button class="it" data-new="1" data-t="${esc(q.trim())}">＋ 建立「${esc(q.trim())}」<span class="new"> 新卡片</span></button>`;A.items.push('\u0000'+q.trim());}
  if(!html){closeAC(which);return;}
  A.idx=0;A.open=true;A.box.innerHTML=html;A.box.classList.add('show');
  // position under caret line: keep simple, place near textarea top offset
  A.box.querySelectorAll('.it').forEach(b=>b.onclick=()=>pickAC(which,b.dataset.t));
}
function closeAC(which){const A=AC[which];if(A.box){A.box.classList.remove('show');}A.open=false;A.items=[];}
function pickAC(which,title){
  const A=AC[which];const ta=A.ta;const pos=ta.selectionStart;
  const before=ta.value.slice(0,pos).replace(/\[\[([^\[\]\n]*)$/,'[['+title+']]');
  const after=ta.value.slice(pos);
  ta.value=before+after;const np=before.length;ta.setSelectionRange(np,np);
  closeAC(which);ta.focus();ta.dispatchEvent(new Event('input'));
}
function acKeydown(which,e){
  const A=AC[which];if(!A.open)return false;
  if(e.key==='ArrowDown'){e.preventDefault();A.idx=Math.min(A.idx+1,A.box.querySelectorAll('.it').length-1);hlAC(which);return true;}
  if(e.key==='ArrowUp'){e.preventDefault();A.idx=Math.max(A.idx-1,0);hlAC(which);return true;}
  if(e.key==='Enter'){e.preventDefault();const it=A.box.querySelectorAll('.it')[A.idx];if(it)pickAC(which,it.dataset.t);return true;}
  if(e.key==='Escape'){closeAC(which);return true;}
  return false;
}
function hlAC(which){const A=AC[which];A.box.querySelectorAll('.it').forEach((b,i)=>b.classList.toggle('on',i===A.idx));}

/* ---------- bindings ---------- */
function autoGrow(ta,min){ta.style.height='auto';ta.style.height=Math.max(min||24,ta.scrollHeight)+'px';}
function bind(){
  const cap=$('#cap');
  if(cap){
    AC.cap.ta=cap;AC.cap.box=$('#ac-cap');
    autoGrow(cap,24);
    cap.oninput=()=>{autoGrow(cap,24);updateAC('cap');};
    cap.onkeydown=e=>{if(acKeydown('cap',e))return;if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doCapture();}};
    cap.onblur=()=>setTimeout(()=>closeAC('cap'),150);
  }
  const cb=$('#capBtn');if(cb)cb.onclick=doCapture;
  bindCapTask();
  const ed=$('#ed');
  if(ed){
    AC.ed.ta=ed;AC.ed.box=$('#ac-ed');
    autoGrow(ed,200);
    ed.oninput=()=>{const n=note(st.id);if(n){n.body=ed.value;n.updatedAt=Date.now();save();queuePush(n);autoGrow(ed,200);const pv=$('#pv');if(pv)pv.innerHTML=renderBody(n);}updateAC('ed');
      // refresh list titles live (debounced-ish)
      const pl=$('#paneList');if(pl){/* light: update on next render */}};
    ed.onkeydown=e=>{acKeydown('ed',e);};
    ed.onblur=()=>setTimeout(()=>{closeAC('ed');refreshListSoft();},160);
  }
}
function refreshListSoft(){ $('#paneList').innerHTML=listHtml(); bindListOnly(); }
function bindListOnly(){
  const cap=$('#cap');
  if(cap){AC.cap.ta=cap;AC.cap.box=$('#ac-cap');autoGrow(cap,24);
    cap.oninput=()=>{autoGrow(cap,24);updateAC('cap');};
    cap.onkeydown=e=>{if(acKeydown('cap',e))return;if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doCapture();}};
    cap.onblur=()=>setTimeout(()=>closeAC('cap'),150);}
  const cb=$('#capBtn');if(cb)cb.onclick=doCapture;
  bindCapTask();
}
function bindCapTask(){
  const ct=$('#capTask');if(!ct)return;
  ct.onchange=()=>{st.capTask=ct.checked;const lb=ct.closest('.captoggle');if(lb)lb.classList.toggle('on',ct.checked);const b=$('#capBtn');if(b)b.textContent=ct.checked?'加入清單':'捕捉';};
}

/* ================= 跨裝置同步（Firebase · 本機優先 · 登入才啟用）================= */
const LS_FB='maxtools.fbconfig.v1';
function getFbConfig(){for(const k of [LS_FB,'worklog.fbconfig.v1']){try{const o=JSON.parse(localStorage.getItem(k));if(o&&o.apiKey)return o;}catch(e){}}return null;}
function parseCfg(txt){let t=(txt||'').trim();const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<=a)return null;t=t.slice(a,b+1);
  try{return (new Function('return ('+t+')'))();}catch(e){try{return JSON.parse(t);}catch(_){return null;}}}
const Sync={on:false,uid:null,email:'',db:null,auth:null,unsub:null,ready:false};
function pushNote(n){ if(!Sync.on||!Sync.db||!Sync.uid||!n)return;
  try{Sync.db.collection('users').doc(Sync.uid).collection('brain_notes').doc(n.id).set(JSON.parse(JSON.stringify(n))).catch(()=>{});}catch(e){} }
let _pq={};
function queuePush(n){ if(!Sync.on)return; clearTimeout(_pq[n.id]); _pq[n.id]=setTimeout(()=>pushNote(n),800); }
function initSync(){
  const cfg=getFbConfig();
  if(!cfg||typeof firebase==='undefined'||!firebase.initializeApp){updateSyncBtn();return;}
  try{
    if(!firebase.apps||!firebase.apps.length)firebase.initializeApp(cfg);
    Sync.auth=firebase.auth(); Sync.db=firebase.firestore();
    try{Sync.db.enablePersistence({synchronizeTabs:true}).catch(()=>{});}catch(e){}
    Sync.ready=true;
    Sync.auth.onAuthStateChanged(u=>onAuth(u),()=>updateSyncBtn());
  }catch(e){updateSyncBtn();}
}
function onAuth(u){
  if(!u){Sync.on=false;Sync.uid=null;Sync.email='';if(Sync.unsub){Sync.unsub();Sync.unsub=null;}updateSyncBtn();return;}
  Sync.uid=u.uid;Sync.email=u.email||'';Sync.on=true;updateSyncBtn();
  const col=Sync.db.collection('users').doc(u.uid).collection('brain_notes');
  col.get().then(snap=>{
    const cloud={};snap.forEach(d=>cloud[d.id]=d.data());
    const local={};data.notes.forEach(n=>local[n.id]=n);
    const ids=new Set([...Object.keys(cloud),...Object.keys(local)]);
    const merged=[];
    ids.forEach(id=>{const c=cloud[id],l=local[id];
      if(c&&l)merged.push((c.updatedAt||0)>=(l.updatedAt||0)?c:l);else merged.push(c||l);});
    data.notes=merged.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));save();
    ids.forEach(id=>{const c=cloud[id],l=local[id];if(l&&(!c||(l.updatedAt||0)>(c.updatedAt||0)))pushNote(l);});
    render();toast('已連上同步 ☁️');
    Sync.unsub=col.onSnapshot(s=>{let ch=false;
      s.docChanges().forEach(x=>{const d=x.doc.data();const cur=data.notes.find(n=>n.id===x.doc.id);
        if(!cur){data.notes.unshift(d);ch=true;}
        else if((d.updatedAt||0)>(cur.updatedAt||0)){Object.assign(cur,d);ch=true;}});
      if(ch){data.notes.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));save();render();}
    },()=>{});
  }).catch(()=>{updateSyncBtn();});
}
function syncSignIn(){ if(!Sync.auth){toast('請先貼上 Firebase 設定');return;}
  const p=new firebase.auth.GoogleAuthProvider();
  Sync.auth.signInWithPopup(p).catch(e=>{const c=(e&&e.code)||'';
    if(/popup|environment|cancelled/.test(c))Sync.auth.signInWithRedirect(p);else toast('登入失敗：'+c);});
  closeSync();}
function syncSignOut(){ if(Sync.auth)Sync.auth.signOut(); closeSync(); toast('已登出，改為只存本機'); }
function saveFbConfig(){
  const cfg=parseCfg($('#fbcfg').value);
  if(!cfg||!cfg.apiKey||!cfg.projectId){toast('設定看起來不完整，請整段貼上 firebaseConfig');return;}
  localStorage.setItem(LS_FB,JSON.stringify(cfg));
  closeSync();initSync();setTimeout(openSync,300);toast('設定已存 ✓ 接著請登入');
}
function updateSyncBtn(){
  const b=$('#syncBtn'),l=$('#syncLbl');if(!b||!l)return;
  if(Sync.on){b.classList.add('on');l.textContent='已同步';}
  else{b.classList.remove('on');l.textContent=getFbConfig()?'登入同步':'同步';}
}
function openSync(){
  const m=$('#syncModal');let inner;
  if(Sync.on){
    inner=`<h3>☁️ 跨裝置同步：已開啟</h3>
      <div class="statusline">✅ 已登入 <span class="mono" style="color:var(--accent)">${esc(Sync.email||'')}</span></div>
      <p style="margin-top:12px">你的電腦、手機、電子書閱讀器只要用<b>同一個 Google 帳號</b>登入這個網頁，卡片就會自動同步。離線時照記，連上網自動補傳。</p>
      <div class="foot"><button class="btn ghost" onclick="closeSync()">關閉</button><button class="btn danger" onclick="syncSignOut()">登出（只存本機）</button></div>`;
  }else if(getFbConfig()){
    inner=`<h3>☁️ 開啟跨裝置同步</h3>
      <p>設定已就緒。用你自己的 Google 帳號登入，三台就會同步同一份。</p>
      <div class="foot"><button class="btn ghost" onclick="closeSync()">關閉</button><button class="btn primary" onclick="syncSignIn()">用 Google 登入</button></div>
      <p style="margin-top:14px;font-size:12px;color:var(--ink-mute)">想換一組設定？<a href="#" onclick="localStorage.removeItem('maxtools.fbconfig.v1');closeSync();setTimeout(openSync,60);return false" style="color:var(--accent)">重設 Firebase 設定</a></p>`;
  }else{
    inner=`<h3>☁️ 設定跨裝置同步</h3>
      <p>資料預設只存在這台裝置。要讓<b>電腦／手機／電子書閱讀器</b>共用同一份，需要一次性接上你自己的免費 Firebase（約 10 分鐘）。</p>
      <ol>
        <li>到 <b>console.firebase.google.com</b> 用你的 Google 帳號建立一個專案</li>
        <li>Build → <b>Firestore Database</b> → 建立（正式或測試模式皆可，稍後貼安全規則）</li>
        <li>Build → <b>Authentication</b> → Sign-in method → 啟用 <b>Google</b></li>
        <li>專案設定 ⚙️ → 你的應用程式 → 新增「網頁」App → 複製整段 <b>firebaseConfig</b></li>
        <li>把它整段貼到下面：</li>
      </ol>
      <textarea id="fbcfg" placeholder="const firebaseConfig = {\n  apiKey: &quot;...&quot;,\n  authDomain: &quot;...&quot;,\n  projectId: &quot;...&quot;,\n  ...\n};"></textarea>
      <div class="foot"><button class="btn ghost" onclick="closeSync()">關閉</button><button class="btn primary" onclick="saveFbConfig()">存設定</button></div>`;
  }
  m.innerHTML=`<div class="sheet">${inner}</div>`;m.classList.add('show');document.body.style.overflow='hidden';
}
function closeSync(){const m=$('#syncModal');m.classList.remove('show');m.innerHTML='';document.body.style.overflow='';}
$('#syncBtn').addEventListener('click',openSync);
$('#syncModal').addEventListener('click',e=>{if(e.target.id==='syncModal')closeSync();});

/* ================= 依類型輸出（把某個 #標籤的筆記整理/匯出）================= */
function typeExportMd(){
  const notes=filteredNotes();const label=st.tag?('#'+st.tag):(st.filter==='inbox'?'收件匣':'全部');
  let s=`# ${label} · 筆記整理（${notes.length} 則）\n\n`;
  notes.forEach(n=>{const t=titleOf(n);const rest=(n.body||'').split('\n').slice(1).join('\n').trim();s+=`## ${t}\n${rest?rest+'\n':''}\n`;});
  return s;
}
function aiType(){
  const label=st.tag?('#'+st.tag):'這些';
  const p=`請把我以下「${label}」的筆記，整理成有條理的重點（若像工作紀錄就整理成週報；像讀書筆記就整理成讀書心得；像任務就整理成待辦清單）。保留我的原意，不要新增我沒寫的內容：\n\n`+typeExportMd();

}
function dlType(){dl(`${st.tag||'筆記'}-整理.md`,typeExportMd());}

/* ================= 更多（其他工具 + 備份 + 安裝）================= */
function brandHome(){st.id=null;st.filter='inbox';st.tag='';st.q='';const q=$('#q');if(q)q.value='';render();}
const BK_KEYS=['brain.data.v1','worklog.data.v1','worklog.settings.v1','studyplan.v1','reading.data.v1','atomichabits.v1'];
function dl(name,text){const bl=new Blob([text],{type:'application/octet-stream'});const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);}
function exportAll(){
  const dump={_app:'MAX備份',_v:1,data:{}};let n=0;
  BK_KEYS.forEach(k=>{const v=localStorage.getItem(k);if(v!=null){dump.data[k]=v;n++;}});
  if(!n){toast('目前沒有資料可備份');return;}
  const d=new Date();const stamp=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
  dl(`第二大腦備份-${stamp}.json`,JSON.stringify(dump));
}
function importAll(file){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.data)throw 0;const keys=Object.keys(o.data).filter(k=>BK_KEYS.includes(k));if(!keys.length){toast('檔案裡沒有可還原的資料');return;}if(!confirm(`將還原 ${keys.length} 項資料並覆蓋本機對應內容，確定？`))return;keys.forEach(k=>localStorage.setItem(k,o.data[k]));try{const d=JSON.parse(localStorage.getItem('brain.data.v1'));if(d&&Array.isArray(d.notes))data=d;}catch(e){}closeMore();render();toast('已還原 ✓');}catch(e){alert('檔案格式不正確，請選本工具「匯出備份」產生的 .json 檔。');}};r.readAsText(file);}

    <div class="sheet-foot" style="margin-top:16px"><button class="btn ghost" onclick="closeMore()" style="flex:1;justify-content:center">關閉</button></div>
