<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>第二大腦 · 捕捉與連結</title>
<meta name="description" content="靈光乍現隨手捕捉，煉成卡片、用 [[雙向連結]] 連成一張知識網，一個搜尋框翻遍全部。你的個人第二大腦。">
<meta name="theme-color" content="#4b3fc4">
<style>
  :root{
    --paper:#f4f3fa; --surface:#ffffff; --panel:#f6f5fc; --raise:#ffffff;
    --ink:#1b1830; --ink-soft:#565073; --ink-mute:#8b86a4;
    --line:#e5e2f0; --dot:#d3cdea;
    --accent:#5b4ee0; --accent-d:#4a3fc4; --accent-soft:#ece9ff;
    --tag:#0e8f80; --tag-soft:#d6f3ee; --gold:#a9791a; --danger:#d64545;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
    --shadow:0 12px 30px rgba(27,24,48,.12); --shadow-sm:0 2px 9px rgba(27,24,48,.08);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#0e0d16; --surface:#181626; --panel:#141221; --raise:#1e1b2e;
      --ink:#eee9f7; --ink-soft:#b1abc7; --ink-mute:#7c7794;
      --line:rgba(255,255,255,.09); --dot:rgba(255,255,255,.09);
      --accent:#9a8dff; --accent-d:#8072f0; --accent-soft:rgba(154,141,255,.16);
      --tag:#2ec4b2; --tag-soft:rgba(46,196,178,.16); --gold:#e6b34d; --danger:#ff6b6b;
      --shadow:0 16px 40px rgba(0,0,0,.5); --shadow-sm:0 2px 12px rgba(0,0,0,.34);
    }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:var(--paper);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;
    padding-bottom:calc(env(safe-area-inset-bottom) + 90px)}
  button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  .mono{font-family:var(--mono)}
  ::selection{background:var(--accent-soft)}

  /* top bar */
  .top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 90%,transparent);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 10px) 15px 10px}
  .top .in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15px;flex:0 0 auto}
  .brand .bx{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#7b6bff,#4b3fc4);
    display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px}
  .search{flex:1;display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);
    border-radius:11px;padding:8px 12px}
  .search input{flex:1;border:none;outline:none;background:none;font-size:14px}
  .search .ic{color:var(--ink-mute);font-size:14px}

  .wrap{max-width:820px;margin:0 auto;padding:16px 15px 0}

  /* capture */
  .capture{background:var(--raise);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow-sm);
    margin-bottom:16px;position:relative}
  .capture::before{content:"⚡";position:absolute;left:16px;top:15px;font-size:16px}
  .capture textarea{width:100%;border:none;outline:none;background:none;resize:none;font-size:16px;line-height:1.6;
    min-height:26px;max-height:200px;padding:2px 0 2px 28px}
  .capture textarea::placeholder{color:var(--ink-mute)}
  .capture .cbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding-left:28px}
  .capture .hint{font-size:11.5px;color:var(--ink-mute)}
  .capture .hint b{color:var(--ink-soft)}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:10px;font-weight:800;font-size:14px;
    background:var(--surface);border:1px solid var(--line);color:var(--ink);transition:.14s}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;border-color:transparent}
  .btn.sm{padding:7px 11px;font-size:13px}
  .btn.ghost{background:transparent;box-shadow:none}
  .btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}

  /* filter chips */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .chip{font-size:13px;font-weight:800;padding:6px 12px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink-soft);display:inline-flex;gap:6px;align-items:center}
  .chip.on{background:var(--accent);color:#fff;border-color:transparent}
  .chip .ct{font-family:var(--mono);font-size:11px;opacity:.8}
  .chip.tag{color:var(--tag)} .chip.tag.on{background:var(--tag);color:#fff}

  /* notes list */
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .note{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px;
    box-shadow:var(--shadow-sm);transition:.14s;display:flex;flex-direction:column;gap:8px;width:100%;min-height:96px}
  .note:hover{border-color:var(--accent);transform:translateY(-1px)}
  .note.inbox{border-left:3px solid var(--gold)}
  .note .nt{font-weight:850;font-size:15px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .note .nb{font-size:12.5px;color:var(--ink-soft);line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
  .note .nf{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;align-items:center}
  .tagchip{font-size:11px;font-weight:700;color:var(--tag);background:var(--tag-soft);border-radius:6px;padding:2px 7px}
  .lkcount{font-family:var(--mono);font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px}
  .note .nd{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);margin-left:auto}

  .empty{text-align:center;padding:44px 20px;color:var(--ink-mute)}
  .empty .big{font-size:42px;margin-bottom:8px}
  .empty p{font-size:14px;max-width:380px;margin:0 auto}

  /* note detail */
  .back{margin-bottom:12px}
  .detail{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .detail .edit{width:100%;border:none;outline:none;background:none;resize:vertical;min-height:220px;padding:20px;
    font-size:16px;line-height:1.75;color:var(--ink)}
  .detail .meta{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-top:1px solid var(--line);
    font-family:var(--mono);font-size:11px;color:var(--ink-mute);flex-wrap:wrap}
  .detail .meta .acts{display:flex;gap:8px}
  .preview{padding:0 20px 6px}
  .preview .pv{font-size:15px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
  .wl{color:var(--accent);font-weight:700;cursor:pointer;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
  .wl.new{color:var(--ink-mute);border-bottom-style:dashed}
  .ht{color:var(--tag);font-weight:700;cursor:pointer}
  .section-t{font-size:12px;font-weight:800;letter-spacing:.05em;color:var(--ink-mute);text-transform:uppercase;
    margin:22px 0 10px}
  .backlinks{display:flex;flex-direction:column;gap:9px}
  .bl{text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
  .bl:hover{border-color:var(--accent)}
  .bl .blt{font-weight:800;font-size:14px}
  .bl .blb{font-size:12px;color:var(--ink-soft);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .none{font-size:13px;color:var(--ink-mute);padding:4px 0}

  /* fab */
  .fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:40;
    width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;
    font-size:26px;display:grid;place-items:center;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 50%,transparent)}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%) translateY(80px);
    background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:24px;font-size:13.5px;font-weight:700;
    box-shadow:var(--shadow);z-index:80;opacity:0;transition:.25s}
  .toast.show{transform:translateX(-50%);opacity:1}

  @media(max-width:560px){.list{grid-template-columns:1fr}}
</style>
</head>
<body>
<a href="../" aria-label="回工具箱首頁" style="position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom) + 86px);z-index:45;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:rgba(75,63,196,.94);color:#fff;font:700 13px/1 system-ui,'Noto Sans TC',sans-serif;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.3)">⌂ 工具箱</a>

<div class="top"><div class="in">
  <div class="brand"><span class="bx">腦</span></div>
  <div class="search"><span class="ic">🔍</span><input id="q" placeholder="搜尋所有卡片…"></div>
</div></div>

<div class="wrap" id="app"></div>

<button class="fab" id="fab" title="快速捕捉">⚡</button>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const LS='brain.data.v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmt=ts=>{const d=new Date(ts);return `${d.getMonth()+1}/${pad(d.getDate())}`;};

let data={notes:[]};
try{const d=JSON.parse(localStorage.getItem(LS));if(d&&Array.isArray(d.notes))data=d;}catch(e){}
let st={view:'home', id:null, filter:'inbox', tag:'', q:''};
let saveT;
function save(){localStorage.setItem(LS,JSON.stringify(data));}
function toast(m){const t=$('#toast');t.textContent=m;t.className='toast show';clearTimeout(saveT);saveT=setTimeout(()=>t.className='toast',1300);}

/* ---------- derive ---------- */
const note=id=>data.notes.find(n=>n.id===id);
const titleOf=n=>{const t=(n.body||'').trim().split(/\n/)[0].trim();return t||'（無標題）';};
const norm=s=>String(s||'').trim().toLowerCase();
function tagsOf(n){const m=(n.body||'').match(/#([^\s#\[\]]+)/g)||[];return [...new Set(m.map(x=>x.slice(1)))];}
function linkTitlesOf(n){const m=(n.body||'').match(/\[\[([^\]]+)\]\]/g)||[];return [...new Set(m.map(x=>x.slice(2,-2).trim()))];}
const noteByTitle=t=>data.notes.find(n=>norm(titleOf(n))===norm(t));
function backlinks(n){const t=norm(titleOf(n));return data.notes.filter(m=>m.id!==n.id&&linkTitlesOf(m).some(x=>norm(x)===t));}
function allTags(){const c={};data.notes.forEach(n=>tagsOf(n).forEach(t=>c[t]=(c[t]||0)+1));return Object.entries(c).sort((a,b)=>b[1]-a[1]);}

/* ---------- capture ---------- */
function capture(text,keep){
  const body=text.trim();if(!body)return null;
  const n={id:uid(),body,status:keep?'kept':'inbox',createdAt:Date.now(),updatedAt:Date.now()};
  data.notes.unshift(n);save();return n;
}

/* ---------- render ---------- */
function render(){
  const app=$('#app');
  app.innerHTML=st.view==='note'?viewNote():viewHome();
  bind();
  if(st.view==='home'&&!st.q){const cap=$('#cap');/* keep capture ready */}
  window.scrollTo({top:0,behavior:'auto'});
}

function viewHome(){
  const q=norm(st.q);
  let notes=data.notes.slice();
  if(q)notes=notes.filter(n=>norm(n.body).includes(q));
  else if(st.tag)notes=notes.filter(n=>tagsOf(n).some(t=>norm(t)===norm(st.tag)));
  else if(st.filter==='inbox')notes=notes.filter(n=>n.status==='inbox');
  // sort newest
  notes.sort((a,b)=>b.updatedAt-a.updatedAt);

  const inboxN=data.notes.filter(n=>n.status==='inbox').length;
  const cap=`<div class="capture">
    <textarea id="cap" rows="1" placeholder="⚡ 靈光乍現？丟進來… 第一行是標題。用 #標籤 分類、[[標題]] 連到別張卡。Enter 捕捉 · Shift+Enter 換行"></textarea>
    <div class="cbar"><span class="hint">Enter <b>捕捉</b> · Shift+Enter 換行 · 先進<b>收件匣</b>，之後再整理</span>
      <button class="btn primary sm" id="capBtn">捕捉</button></div>
  </div>`;

  let chips;
  if(q){chips=`<div class="chips"><span class="chip on">🔍 搜尋：${esc(st.q)}（${notes.length}）</span><button class="chip" onclick="clearQ()">✕ 清除</button></div>`;}
  else{
    const tags=allTags().slice(0,12).map(([t,c])=>`<button class="chip tag ${st.tag===t?'on':''}" onclick="setTag('${esc(t)}')">#${esc(t)} <span class="ct">${c}</span></button>`).join('');
    chips=`<div class="chips">
      <button class="chip ${st.filter==='inbox'&&!st.tag?'on':''}" onclick="setFilter('inbox')">⚡ 收件匣 <span class="ct">${inboxN}</span></button>
      <button class="chip ${st.filter==='all'&&!st.tag?'on':''}" onclick="setFilter('all')">🗂️ 全部 <span class="ct">${data.notes.length}</span></button>
      ${tags}
    </div>`;
  }

  let body;
  if(!data.notes.length){
    body=`<div class="empty"><div class="big">🧠</div>
      <p>這是你的第二大腦。<b>任何時候有想法，先丟進上面的框</b>——不用想分類、不用完整。之後再連結、整理。</p>
      <p style="margin-top:12px"><button class="btn" onclick="seedBrain()">看個範例</button></p></div>`;
  }else if(!notes.length){
    body=`<div class="empty"><div class="big">✨</div><p>${q?'沒有符合的卡片。':st.tag?`#${esc(st.tag)} 底下還沒有卡片。`:'收件匣清空了，做得好！切到「全部」看所有卡片。'}</p></div>`;
  }else{
    body=`<div class="list">${notes.map(noteCard).join('')}</div>`;
  }
  return cap+chips+body;
}
function noteCard(n){
  const tags=tagsOf(n).slice(0,3).map(t=>`<span class="tagchip">#${esc(t)}</span>`).join('');
  const lc=linkTitlesOf(n).length, bc=backlinks(n).length, tot=lc+bc;
  const rest=(n.body||'').trim().split(/\n/).slice(1).join('\n').trim();
  return `<button class="note ${n.status==='inbox'?'inbox':''}" onclick="openNote('${n.id}')">
    <div class="nt">${esc(titleOf(n))}</div>
    ${rest?`<div class="nb">${esc(rest)}</div>`:''}
    <div class="nf">${tags}${tot?`<span class="lkcount">🔗 ${tot}</span>`:''}<span class="nd">${fmt(n.updatedAt)}</span></div>
  </button>`;
}

function viewNote(){
  const n=note(st.id);if(!n){st.view='home';return viewHome();}
  const bl=backlinks(n);
  return `<button class="btn ghost sm back" onclick="goHome()">← 返回</button>
    <div class="detail">
      <textarea class="edit" id="ed" placeholder="第一行＝標題，接著寫內容。#標籤 · [[連到別張卡]]">${esc(n.body)}</textarea>
      <div class="preview"><div class="pv" id="pv">${renderBody(n)}</div></div>
      <div class="meta">
        <span>建立 ${new Date(n.createdAt).toLocaleString('zh-TW',{hour12:false}).slice(0,16)}</span>
        <span class="acts">
          <button class="btn ghost sm" onclick="toggleKeep('${n.id}')">${n.status==='inbox'?'✓ 移出收件匣':'↩ 收回收件匣'}</button>
          <button class="btn ghost sm danger" onclick="delNote('${n.id}')">刪除</button>
        </span>
      </div>
    </div>
    <div class="section-t">🔗 連到這張卡的（反向連結 · ${bl.length}）</div>
    ${bl.length?`<div class="backlinks">${bl.map(m=>`<button class="bl" onclick="openNote('${m.id}')"><div class="blt">${esc(titleOf(m))}</div><div class="blb">${esc((m.body||'').replace(/\n/g,' '))}</div></button>`).join('')}</div>`:'<div class="none">還沒有其他卡連過來。在別張卡打 [['+esc(titleOf(n))+']] 就會出現在這裡。</div>'}`;
}
function renderBody(n){
  let h=esc(n.body||'');
  // wiki links [[Title]]
  h=h.replace(/\[\[([^\]]+)\]\]/g,(m,t)=>{
    const title=t.trim();const hit=noteByTitle(title);
    return `<span class="wl ${hit?'':'new'}" onclick="openTitle('${esc(title).replace(/'/g,"\\'")}')">[[${esc(title)}]]</span>`;
  });
  // hashtags
  h=h.replace(/#([^\s#\[\]<]+)/g,(m,t)=>`<span class="ht" onclick="setTag('${esc(t).replace(/'/g,"\\'")}')">#${esc(t)}</span>`);
  return h;
}

/* ---------- actions ---------- */
function doCapture(){
  const ta=$('#cap');if(!ta)return;
  const n=capture(ta.value);if(!n){ta.focus();return;}
  ta.value='';autoGrow(ta);toast('已捕捉 ⚡');render();$('#cap')&&$('#cap').focus();
}
function openNote(id){st.view='note';st.id=id;st.q='';render();}
function goHome(){st.view='home';st.id=null;render();}
function openTitle(title){
  let n=noteByTitle(title);
  if(!n){n=capture(title,true);toast('已建立新卡片 ✓');}
  st.view='note';st.id=n.id;render();
}
function setFilter(f){st.filter=f;st.tag='';st.q='';$('#q').value='';render();}
function setTag(t){st.tag=t;st.q='';$('#q').value='';st.view='home';render();}
function clearQ(){st.q='';$('#q').value='';render();}
function toggleKeep(id){const n=note(id);if(n){n.status=n.status==='inbox'?'kept':'inbox';n.updatedAt=Date.now();save();render();}}
function delNote(id){if(!confirm('刪除這張卡片？'))return;data.notes=data.notes.filter(n=>n.id!==id);save();goHome();toast('已刪除');}

/* ---------- bindings ---------- */
function autoGrow(ta){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,200)+'px';}
function bind(){
  const cap=$('#cap');
  if(cap){
    autoGrow(cap);
    cap.oninput=()=>autoGrow(cap);
    cap.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doCapture();}};
  }
  const cb=$('#capBtn');if(cb)cb.onclick=doCapture;
  const ed=$('#ed');
  if(ed){
    autoGrow2(ed);
    ed.oninput=()=>{const n=note(st.id);if(n){n.body=ed.value;n.updatedAt=Date.now();save();autoGrow2(ed);const pv=$('#pv');if(pv)pv.innerHTML=renderBody(n);}};
  }
}
function autoGrow2(ta){ta.style.height='auto';ta.style.height=Math.max(220,ta.scrollHeight)+'px';}

/* search box (persistent) */
$('#q').addEventListener('input',e=>{st.q=e.target.value;if(st.view!=='home'){st.view='home';st.id=null;}renderKeepSearch();});
function renderKeepSearch(){const app=$('#app');app.innerHTML=viewHome();bind();}
$('#fab').onclick=()=>{if(st.view!=='home'){goHome();}setTimeout(()=>{const c=$('#cap');if(c){c.focus();c.scrollIntoView({block:'center'});}},40);};

/* ---------- sample ---------- */
function seedBrain(){
  const mk=(body,keep)=>data.notes.push({id:uid(),body,status:keep?'kept':'inbox',createdAt:Date.now()-Math.floor(Math.random()*1e7),updatedAt:Date.now()-Math.floor(Math.random()*1e7)});
  mk('有用 ＞ 完美\n與其問「我夠不夠完美」，不如問「我對別人有沒有用」。把力氣放在創造價值，就不需要靠完美證明自己。 #思維 #馬斯克\n延伸：[[第一性原理]]',true);
  mk('第一性原理\n把問題拆到最根本的事實重推，而不是照別人的做法（類比）。benchmark 本質上是類比。 #思維',true);
  mk('靈光乍現：老屋帶看時，先讓屋主自己講他最不滿意的地方，再切入延壽方案。比一開始就報方案更有效。 #工作 #帶看',false);
  mk('樹幹 vs 樹葉\n先建根本原理（樹幹），細節技巧（樹葉）才有地方掛。讀書、學東西都適用。 #學習\n呼應 [[第一性原理]]',true);
  save();st.filter='all';render();toast('已載入範例，可隨時刪除 ✓');
}

/* ---------- PWA ---------- */
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}));}

render();
setTimeout(()=>{const c=$('#cap');if(c&&!data.notes.length)c.focus();},60);
</script>
</body>
</html>
