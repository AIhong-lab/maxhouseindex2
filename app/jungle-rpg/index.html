<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1b4332" />

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; }
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background: #0f2017;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .game-shell {
      width: 100%;
      max-width: 440px;
      height: 100%;
      max-height: 840px;
      background: #fdfbf5;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    }
    @media (min-width: 480px) {
      .game-shell { height: 94%; border-radius: 28px; border: 4px solid #fbbf24; }
    }
    @keyframes hop { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2px) scale(1.06); } }
    .cute-hop { animation: hop 1.4s ease-in-out infinite; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
    .shake { animation: shake 0.35s ease-in-out; }
    @keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 0) scale(0.8); } 15% { opacity: 1; transform: translate(-50%, -6px) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -46px) scale(1); } }
    .dmg-float { position: absolute; left: 50%; top: 30%; font-weight: 900; font-size: 1.6rem; pointer-events: none; animation: floatUp 0.9s ease-out forwards; text-shadow: 0 2px 0 #fff, 0 0 6px rgba(0,0,0,.25); }
    @keyframes popIn { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: none; } }
    .pop-in { animation: popIn 0.25s ease-out; }
    @keyframes flashRed { 0% { background: rgba(244,63,94,.35); } 100% { background: transparent; } }
    .flash-red { animation: flashRed 0.4s ease-out; }
    .rpg-box { background: rgba(17, 34, 24, 0.96); border: 3px solid #fbbf24; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45); }
    button:disabled { opacity: .45; cursor: not-allowed; transform: none !important; }
    button:focus-visible { outline: 3px solid #fbbf24; outline-offset: 2px; }
    .caret::after { content: '▍'; animation: blink 0.8s steps(1) infinite; color: #fbbf24; margin-left: 2px; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .cute-hop, .shake, .pop-in, .flash-red, .animate-pulse { animation: none !important; }
    }
  </style>
</head>

  <script>
    // =========================================================================
    // 1. Web Audio 合成音效（設定會記住；切到背景自動暫停）
    // =========================================================================
    const SOUND_KEY = 'jungle_rpg_sound';
    const Sfx = (() => {
      let ctx = null;
      let enabled = true;
      try { enabled = localStorage.getItem(SOUND_KEY) !== 'off'; } catch (e) {}
      let bgmTimer = null;
      let step = 0;
      const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];

      function init() {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) ctx = new AC();
        }
        if (ctx && ctx.state === 'suspended' && !document.hidden) ctx.resume().catch(() => {});
      }
      function tone(freq, dur, type = 'triangle', vol = 0.08) {
        if (!enabled || !ctx || ctx.state !== 'running') return;
        const t = ctx.currentTime;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(0.001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g);
        g.connect(ctx.destination);
        o.start(t);
        o.stop(t + dur + 0.02);
      }
      function startBgm() {
        init();
        if (bgmTimer) return;
        bgmTimer = setInterval(() => { tone(notes[step % notes.length], 0.35, 'sine', 0.022); step++; }, 480);
      }
      document.addEventListener('visibilitychange', () => {
        if (!ctx) return;
        if (document.hidden) ctx.suspend().catch(() => {});
        else ctx.resume().catch(() => {});
      });
      return {
        init, startBgm,
        get enabled() { return enabled; },
        toggle() {
          enabled = !enabled;
          try { localStorage.setItem(SOUND_KEY, enabled ? 'on' : 'off'); } catch (e) {}
          if (enabled) init();
          return enabled;
        },
        blip() { init(); tone(440, 0.05, 'square', 0.035); },
        coin() { init(); tone(659.25, 0.1, 'triangle', 0.09); setTimeout(() => tone(880, 0.14, 'triangle', 0.09), 60); },
        hit() { init(); tone(150, 0.2, 'sawtooth', 0.09); },
        bump() { init(); tone(110, 0.08, 'square', 0.04); },
        tick() { init(); tone(1200, 0.03, 'square', 0.03); },
        crit() { init(); tone(988, 0.08, 'square', 0.07); setTimeout(() => tone(1318.5, 0.16, 'square', 0.07), 70); },
        win() { init(); [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => setTimeout(() => tone(f, 0.2, 'triangle', 0.1), i * 90)); }
      };
    })();

    // =========================================================================

    // =========================================================================

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function replayAnim(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
    const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function shuffleOpts(q) {
      const order = shuffle(q.opts.map((_, i) => i));
      return { ...q, opts: order.map(i => q.opts[i]), ans: order.indexOf(q.ans ?? 0) };
    }

    // 不重複抽題：優先抽「目前難度」的題目
    const usedQ = new Set();
    function pickQuestions(cats, maxLv, n, exclude = []) {
      const pool = QUESTION_BANK.filter(q => (!cats || cats.includes(q.cat)) && q.lv <= maxLv && !exclude.includes(q.q));
      let fresh = pool.filter(q => !usedQ.has(q.q));
      if (fresh.length < n) { pool.forEach(q => usedQ.delete(q.q)); fresh = pool; }
      const picked = shuffle(fresh).sort((a, b) => (b.lv === maxLv) - (a.lv === maxLv)).slice(0, n);
      picked.forEach(q => usedQ.add(q.q));
      return picked.map(q => ({ ...q, tag: CAT_LABEL[q.cat] + '・' + '★'.repeat(q.lv) }));
    }

      return { stageIdx: 0, level: 1, hp: 100, maxHp: 100, atk: 18, def: 10, honey: 3, bag: [], cleared: new Array(STAGES.length).fill(false) };
    }
    function freshRun() {
      return { round: 1, level: 1, hp: 120, maxHp: 120, atk: 20, def: 12, honey: 3, bag: [], solved: 0 };
    }

    let state = freshState();   // 故事模式存檔
    let run = null;             // 連續闖關狀態
    let game = 'story';         // 'story' | 'endless'
    let P = state;              // 目前使用中的角色數值
    let mode = 'title';
    let cur = null;             // 目前這一關的設定

    let bestRound = 0;
    try { bestRound = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) {}

    function saveProgress() {
      if (game !== 'story') return;
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
    }
    function saveBest() {
      try { localStorage.setItem(BEST_KEY, String(bestRound)); } catch (e) {}
    }
    function loadProgress() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return null;
        const p = JSON.parse(raw);
        if (!p || typeof p.stageIdx !== 'number' || !Array.isArray(p.cleared)) return null;
        const s = { ...freshState(), ...p };
        s.bag = (Array.isArray(s.bag) ? s.bag : []).filter(b => b && b.icon !== '🍯');
        s.stageIdx = Math.max(0, Math.min(STAGES.length - 1, Math.floor(s.stageIdx)));
        while (s.cleared[s.stageIdx] && s.stageIdx < STAGES.length - 1) s.stageIdx++;
        s.hp = Math.max(1, Math.min(s.maxHp, s.hp));
        return s;
      } catch (e) {}
      return null;
    }
    function resetState() {
      state = freshState();
      if (game === 'story') P = state;
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    }
    const allCleared = () => state.cleared.every(Boolean);

    // 難度：故事第 1 篇 = tier 0，第 12 篇 = tier 11；連續闖關第 1 關 = tier 6，之後每關 +1
    function difficulty() {
      const tier = game === 'story' ? state.stageIdx : 5 + run.round;
      return {
        tier,
        mapN: tier < 3 ? 11 : tier < 8 ? 13 : 15,
        obstacles: Math.min(9, 1 + Math.floor(tier / 2)),
        obstacleKinds: Math.min(OBSTACLES.length, 2 + tier),
        qLevel: tier < 3 ? 1 : tier < 7 ? 2 : 3,
        penalty: Math.round(8 + tier * 1.5),
        timeLimit: game === 'endless' ? Math.max(8, 22 - run.round) : 0,
        loops: tier < 6 ? 2 : 1,
        lootCount: game === 'endless' ? 2 : 3,
        chargeChance: Math.min(0.5, 0.22 + tier * 0.02)
      };
    }

    function updateHud() {
      if (game === 'endless' && run) {
        $('hud-lv').textContent = `🔥第${run.round}關`;
        $('hud-rank').textContent = '連續闖關';
        $('hud-ch-num').textContent = `(最佳 ${bestRound})`;
      } else {
        $('hud-lv').textContent = `Lv.${state.level}`;
        $('hud-ch-num').textContent = `(${state.stageIdx + 1}/${STAGES.length})`;
        $('hud-rank').textContent = CUB_RANKS[Math.min(state.cleared.filter(Boolean).length, CUB_RANKS.length - 1)];
      }
      $('hud-hp-txt').textContent = `HP ${P.hp}/${P.maxHp}`;
      const pct = Math.max(0, Math.round((P.hp / P.maxHp) * 100));
      const bar = $('hud-hp-bar');
      bar.style.width = `${pct}%`;
      bar.className = `h-full transition-all duration-300 ${pct <= 30 ? 'bg-red-600 animate-pulse' : 'bg-rose-500'}`;
      $('bag-count').textContent = game === 'endless' ? `${run ? run.solved : 0}` : state.bag.length;
      $('stat-atk').textContent = P.atk;
      $('stat-def').textContent = P.def;
      $('act-heal').textContent = `🍯 蜂蜜補血 (${P.honey})`;
    }

    function hideAllPanels() {
      [mapPanel, battlePanel, quizPanel].forEach(p => { p.classList.add('hidden'); p.classList.remove('flex'); });
      sceneCard.classList.add('hidden');
      rpgDialogue.classList.add('hidden');
    }
    function showPanel(p) {
      p.classList.remove('hidden');
      p.classList.add('flex');
      if (!reducedMotion) replayAnim(p, 'pop-in');
    }

    // 標題 / 結算畫面：按鈕動態產生；confirm:true 的按鈕要連按兩次
    const BTN_STYLE = {
      primary: 'w-full py-4 rounded-2xl bg-amber-500 hover:bg-amber-400 active:scale-95 text-emerald-950 font-black text-lg shadow-xl transition',
      fire: 'w-full py-3.5 rounded-xl bg-rose-600 hover:bg-rose-500 active:scale-95 text-white font-black text-base shadow-lg',
      secondary: 'w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-black text-base shadow-lg',
      ghost: 'w-full py-3 rounded-xl bg-white/15 hover:bg-white/25 text-emerald-100 font-bold text-sm border border-white/25'
    };
    function showOverlay({ icon, chapter, title, sub, buttons }) {
      hideAllPanels();
      stopAutoWalk();
      stopQuizTimer();
      $('ov-icon').textContent = icon;
      const ch = $('ov-chapter');
      ch.textContent = chapter || '';
      ch.classList.toggle('hidden', !chapter);
      $('ov-title').textContent = title;
      $('ov-sub').textContent = sub;
      const box = $('ov-buttons');
      box.innerHTML = '';
      buttons.forEach((b, i) => {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = BTN_STYLE[b.style || (i === 0 ? 'primary' : 'ghost')];
        el.textContent = b.text;
        let armed = false;
        el.addEventListener('click', () => {
          if (b.confirm && !armed) {
            armed = true;
            el.textContent = '⚠️ 再按一次確認';
            setTimeout(() => { armed = false; el.textContent = b.text; }, 3000);
            return;
          }
          if (!b.noMusic) Sfx.startBgm();
          b.onClick();
        });
        box.appendChild(el);
      });
      overlay.classList.remove('hidden');
      const first = box.querySelector('button');
      if (first) setTimeout(() => first.focus({ preventScroll: true }), 0);
    }

    // =========================================================================
    // 6. 劇情對話（打字機效果）
    // =========================================================================
    let dlgQueue = [], dlgIdx = 0, dlgCallback = null, dlgFinalLabel = '繼續 ▶';
    let typeTimer = null, typing = false;

    function startDialogue(lines, onFinish, finalLabel = '繼續 ▶') {
      mode = 'dialogue';
      stopAutoWalk();
      overlay.classList.add('hidden');
      hideAllPanels();
      $('sc-chapter').textContent = cur.chapter;
      $('sc-emoji').textContent = cur.emoji;
      sceneCard.classList.remove('hidden');
      dlgQueue = lines;
      dlgIdx = 0;
      dlgCallback = onFinish;
      dlgFinalLabel = finalLabel;
      rpgDialogue.classList.remove('hidden');
      if (!reducedMotion) replayAnim(rpgDialogue, 'pop-in');
      renderDialogueLine();
    }
    function finishTyping() {
      if (typeTimer) clearInterval(typeTimer);
      typeTimer = null;
      typing = false;
      const textEl = $('dlg-text');
      textEl.textContent = dlgQueue[dlgIdx].txt;
      textEl.classList.remove('caret');
    }
    function renderDialogueLine() {
      const line = dlgQueue[dlgIdx];
      $('dlg-avatar').textContent = line.av;
      $('dlg-speaker').textContent = line.sp;
      $('dlg-page').textContent = `${dlgIdx + 1} / ${dlgQueue.length}`;
      $('dlg-next').textContent = dlgIdx < dlgQueue.length - 1 ? '下一句 ▶' : dlgFinalLabel;
      Sfx.blip();
      const textEl = $('dlg-text');
      if (typeTimer) clearInterval(typeTimer);
      if (reducedMotion) { typing = true; finishTyping(); return; }
      const chars = Array.from(line.txt);
      let i = 0;
      typing = true;
      textEl.textContent = '';
      textEl.classList.add('caret');
      typeTimer = setInterval(() => {
        i++;
        textEl.textContent = chars.slice(0, i).join('');
        if (i >= chars.length) finishTyping();
      }, 28);
    }
    function advanceDialogue() {
      if (mode !== 'dialogue') return;
      if (typing) { finishTyping(); return; }
      if (dlgIdx < dlgQueue.length - 1) { dlgIdx++; renderDialogueLine(); return; }
      rpgDialogue.classList.add('hidden');
      const cb = dlgCallback;
      dlgCallback = null;
      if (cb) cb();
    }
    rpgDialogue.addEventListener('click', advanceDialogue);

    // =========================================================================
    // 7. 隨機迷宮 + 阻礙
    // =========================================================================
    const CUTE_WOLF_TILE = `<svg viewBox="0 0 40 40" class="w-9 h-9 cute-hop" aria-hidden="true"><polygon points="7,15 11,4 18,13" fill="#6b7280"/><polygon points="33,15 29,4 22,13" fill="#6b7280"/><circle cx="20" cy="22" r="12" fill="#9ca3af"/><ellipse cx="20" cy="26" rx="8" ry="6" fill="#f9fafb"/><circle cx="15" cy="20" r="2" fill="#111827"/><circle cx="25" cy="20" r="2" fill="#111827"/><polygon points="18,24 22,24 20,27" fill="#111827"/><polygon points="12,32 28,32 20,38" fill="#f59e0b"/></svg>`;
    const LOOT_ICON = { honey: '🍯', chest: '🎁', clover: '🍀' };
    const DIRS4 = [[0, -1], [0, 1], [-1, 0], [1, 0]];

    function generateMaze(d, accent, npcInfo) {
      const N = d.mapN;
      const grid = Array.from({ length: N }, () => Array(N).fill(1));
      const start = { x: 1, y: N - 2 };

      // 迭代式 DFS 挖迷宮
      const stack = [[start.x, start.y]];
      grid[start.y][start.x] = 0;
      while (stack.length) {
        const [cx, cy] = stack[stack.length - 1];
        const options = shuffle([[0, -2], [0, 2], [-2, 0], [2, 0]]).filter(([dx, dy]) => {
          const nx = cx + dx, ny = cy + dy;
          return nx > 0 && nx < N - 1 && ny > 0 && ny < N - 1 && grid[ny][nx] === 1;
        });
        if (!options.length) { stack.pop(); continue; }
        const [dx, dy] = options[0];
        grid[cy + dy / 2][cx + dx / 2] = 0;
        grid[cy + dy][cx + dx] = 0;
        stack.push([cx + dx, cy + dy]);
      }

      // 打通少量牆形成迴圈
      const breakable = [];
      for (let y = 1; y < N - 1; y++) for (let x = 1; x < N - 1; x++) {
        if (grid[y][x] === 1 && ((x % 2 === 0 && y % 2 === 1) || (x % 2 === 1 && y % 2 === 0))) breakable.push([x, y]);
      }
      shuffle(breakable).slice(0, d.loops).forEach(([x, y]) => { grid[y][x] = 0; });

      // 裝飾地形
      for (let y = 1; y < N - 1; y++) for (let x = 1; x < N - 1; x++) {
        if (grid[y][x] === 0 && !(x === start.x && y === start.y) && Math.random() < 0.14) grid[y][x] = accent;
      }

      // BFS：距離與父節點
      const dist = Array.from({ length: N }, () => Array(N).fill(-1));
      const parent = new Map();
      const q = [[start.x, start.y]];
      dist[start.y][start.x] = 0;
      const walkable = [];
      let far = { x: start.x, y: start.y, d: 0 };
      for (let h = 0; h < q.length; h++) {
        const [cx, cy] = q[h];
        const dd = dist[cy][cx];
        if (dd > 0) walkable.push({ x: cx, y: cy, d: dd });
        if (dd > far.d) far = { x: cx, y: cy, d: dd };
        for (const [dx, dy] of DIRS4) {
          const nx = cx + dx, ny = cy + dy;
          if (nx >= 0 && nx < N && ny >= 0 && ny < N && grid[ny][nx] !== 1 && dist[ny][nx] === -1) {
            dist[ny][nx] = dd + 1;
            parent.set(`${nx},${ny}`, [cx, cy]);
            q.push([nx, ny]);
          }
        }
      }

      // 起點 → NPC 的主路線，阻礙平均放在主路線上（一定會遇到）
      const path = [];
      let k = `${far.x},${far.y}`;
      let node = [far.x, far.y];
      while (node && !(node[0] === start.x && node[1] === start.y)) {
        path.unshift(node);
        node = parent.get(k);
        if (node) k = `${node[0]},${node[1]}`;
      }
      const kinds = OBSTACLES.slice(0, d.obstacleKinds);
      const obstacles = [];
      const usable = path.slice(1, -1); // 不放在起點旁和 NPC 身上
      const count = Math.min(d.obstacles, usable.length);
      const taken = new Set();
      for (let i = 0; i < count; i++) {
        const idx = Math.floor(((i + 1) * usable.length) / (count + 1));
        const [x, y] = usable[Math.min(usable.length - 1, idx)];
        if (taken.has(`${x},${y}`)) continue;
        taken.add(`${x},${y}`);
        grid[y][x] = 0;
        obstacles.push({ x, y, ...kinds[Math.floor(Math.random() * kinds.length)], cleared: false });
      }

      const lootCands = shuffle(walkable.filter(p => !(p.x === far.x && p.y === far.y) && p.d >= 3 && !taken.has(`${p.x},${p.y}`)));
      const kindsLoot = shuffle(['honey', 'chest', 'clover']).slice(0, d.lootCount);
      const loot = kindsLoot.map((kind, i) => lootCands[i] && { x: lootCands[i].x, y: lootCands[i].y, kind, taken: false }).filter(Boolean);

      return { N, grid, start, npc: { ...npcInfo, x: far.x, y: far.y }, loot, obstacles };
    }

    let M = null; // 目前地圖
    let stepsSinceEvent = 0;
    let mapPlayer = { x: 1, y: 9 };
    let visitedGrid = [];
    let walkTimer = null, hintTimer = null;
    let swipeStart = null, swipeMoved = false;

    function stopAutoWalk() { if (walkTimer) { clearInterval(walkTimer); walkTimer = null; } }
    const inBounds = (x, y) => M && x >= 0 && x < M.N && y >= 0 && y < M.N;
    const obstacleAt = (x, y) => M.obstacles.find(o => !o.cleared && o.x === x && o.y === y);

    function revealAround(px, py) {
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
        const nx = px + dx, ny = py + dy;
        if (inBounds(nx, ny) && Math.abs(dx) + Math.abs(dy) <= 2) visitedGrid[ny][nx] = true;
      }
    }

    function enterMap() {
      const d = difficulty();
      cur.diff = d;
      M = generateMaze(d, cur.accent, cur.npc);
      mapPlayer = { ...M.start };
      stepsSinceEvent = 0;
      visitedGrid = Array.from({ length: M.N }, () => Array(M.N).fill(false));
      revealAround(mapPlayer.x, mapPlayer.y);
      mode = 'map';
      overlay.classList.add('hidden');
      hideAllPanels();
      showPanel(mapPanel);
      updateHud();
      flashHint(`${cur.mapTitle}：沿路有 ${M.obstacles.length} 個阻礙，找到 ❗ ${M.npc.name}`, 2200);
      renderForestMap();
    }
    function backToMap(msg) {
      mode = 'map';
      hideAllPanels();
      showPanel(mapPanel);
      updateHud();
      if (msg) flashHint(msg, 1800);
      renderForestMap();
    }

    function getCompassDir(px, py, tx, ty) {
      const dx = tx - px, dy = ty - py;
      const v = dy < 0 ? '北' : dy > 0 ? '南' : '';
      const h = dx > 0 ? '東' : dx < 0 ? '西' : '';
      const arrows = { '北': '⬆️', '南': '⬇️', '東': '➡️', '西': '⬅️', '東北': '↗️', '西北': '↖️', '東南': '↘️', '西南': '↙️' };
      const dir = v + h;
      return dir ? `在${dir}方 ${arrows[dir]}` : '就在眼前';
    }
    const compassHint = () => `❗ ${M.npc.name} ${getCompassDir(mapPlayer.x, mapPlayer.y, M.npc.x, M.npc.y)}`;
    function flashHint(msg, ms = 1600) {
      const el = $('map-quest-hint');
      el.textContent = msg;
      if (hintTimer) clearTimeout(hintTimer);
      hintTimer = setTimeout(() => { hintTimer = null; if (mode === 'map') el.textContent = compassHint(); }, ms);
    }

    function renderForestMap() {
      const N = M.N;
      const camX = Math.max(0, Math.min(N - VIEW, mapPlayer.x - 3));
      const camY = Math.max(0, Math.min(N - VIEW, mapPlayer.y - 3));
      if (!hintTimer) $('map-quest-hint').textContent = compassHint();
      const lootTaken = M.loot.filter(l => l.taken).length;
      const obLeft = M.obstacles.filter(o => !o.cleared).length;
      $('map-loot-left').textContent = `寶物 ${lootTaken}/${M.loot.length}・阻礙剩 ${obLeft}`;

      let html = '';
      for (let vy = 0; vy < VIEW; vy++) for (let vx = 0; vx < VIEW; vx++) {
        const x = camX + vx, y = camY + vy;
        const seen = visitedGrid[y][x];
        const tile = M.grid[y][x];
        const isPlayer = mapPlayer.x === x && mapPlayer.y === y;
        const isNpc = M.npc.x === x && M.npc.y === y;
        const loot = M.loot.find(l => !l.taken && l.x === x && l.y === y);
        const ob = obstacleAt(x, y);
        let bg = 'bg-[#d8f3dc]';
        let content = '';
        if (!seen && !isNpc) {
          bg = 'bg-[#132a1e]';
          content = '<span class="opacity-40 text-base">☁️</span>';
        } else {
          if (tile === 1) { bg = 'bg-[#2d6a4f]'; content = '<span class="text-2xl">🌳</span>'; }
          else if (tile === 2) { bg = 'bg-sky-200'; content = '<span class="text-xl">💧</span>'; }
          else if (tile === 3) { bg = 'bg-stone-200'; content = '<span class="text-xl">🪨</span>'; }
          else if (tile === 4) { content = '<span class="text-lg">🌼</span>'; }
          if (loot) content = `<span class="text-2xl">${LOOT_ICON[loot.kind]}</span>`;
          if (ob) { bg = 'bg-orange-200 ring-2 ring-orange-500'; content = `<span class="text-2xl">${ob.icon}</span>`; }
          if (isNpc) {
            bg = 'bg-amber-300 ring-2 ring-white animate-pulse';
            content = `<span class="relative text-2xl">${M.npc.icon}<span class="absolute -top-2 -right-2 text-xs">❗</span></span>`;
          }
          if (isPlayer) { bg = 'bg-amber-100 ring-2 ring-amber-500 shadow-inner'; content = CUTE_WOLF_TILE; }
        }
        html += `<button data-mx="${x}" data-my="${y}" type="button" tabindex="-1" class="${bg} rounded-xl flex items-center justify-center aspect-square leading-none">${content}</button>`;
      }
      mapGridEl.innerHTML = html;
    }

    function walkToTile(tx, ty) {
      stopAutoWalk();
      if (mode !== 'map' || !inBounds(tx, ty) || M.grid[ty][tx] === 1) return;
      if (tx === mapPlayer.x && ty === mapPlayer.y) return;
      if (!visitedGrid[ty][tx]) { flashHint('☁️ 那裡還在迷霧中，先往附近探索吧！', 1200); Sfx.bump(); return; }
      const prev = new Map([[`${mapPlayer.x},${mapPlayer.y}`, null]]);
      const q = [[mapPlayer.x, mapPlayer.y]];
      let found = false;
      for (let h = 0; h < q.length; h++) {
        const [cx, cy] = q[h];
        if (cx === tx && cy === ty) { found = true; break; }
        for (const [dx, dy] of DIRS4) {
          const nx = cx + dx, ny = cy + dy, key = `${nx},${ny}`;
          if (inBounds(nx, ny) && M.grid[ny][nx] !== 1 && visitedGrid[ny][nx] && !prev.has(key)) {
            prev.set(key, [cx, cy, dx, dy]);
            q.push([nx, ny]);
          }
        }
      }
      if (!found) { flashHint('🤔 目前已知的路走不到那裡', 1200); Sfx.bump(); return; }
      const path = [];
      let key = `${tx},${ty}`;
      while (prev.get(key)) {
        const [px, py, dx, dy] = prev.get(key);
        path.unshift([dx, dy]);
        key = `${px},${py}`;
      }
      let step = 0;
      walkTimer = setInterval(() => {
        if (mode !== 'map' || step >= path.length) { stopAutoWalk(); return; }
        const [dx, dy] = path[step++];
        if (!moveMapPlayer(dx, dy)) stopAutoWalk();
      }, 115);
    }

    function moveMapPlayer(dx, dy) {
      if (mode !== 'map') return false;
      const nx = mapPlayer.x + dx, ny = mapPlayer.y + dy;
      if (!inBounds(nx, ny) || M.grid[ny][nx] === 1) {
        Sfx.bump();
        if (!reducedMotion) replayAnim(mapGridEl, 'shake');
        return false;
      }
      const ob = obstacleAt(nx, ny);
      if (ob) { stopAutoWalk(); startObstacle(ob); return false; }

      mapPlayer.x = nx;
      mapPlayer.y = ny;
      revealAround(nx, ny);
      Sfx.blip();

      const loot = M.loot.find(l => !l.taken && l.x === nx && l.y === ny);
      if (loot) {
        loot.taken = true;
        Sfx.coin();
        if (loot.kind === 'honey') {
          const full = P.honey >= 5;
          P.honey = Math.min(5, P.honey + 1);
          P.hp = Math.min(P.maxHp, P.hp + 20);
          flashHint(full ? '🍯 蜂蜜罐已滿（上限 5）！HP +20' : '🍯 撿到森林蜂蜜！HP +20、蜂蜜 +1');
        } else if (loot.kind === 'clover') {
          P.hp = Math.min(P.maxHp, P.hp + 25);
          flashHint('🍀 發現幸運草！體力恢復 25 HP');
        } else {
          P.atk += 2; P.def += 2;
          flashHint('🎁 打開童軍禮物盒！勇氣 +2、智慧 +2');
        }
        updateHud();
        saveProgress();
      }

      if (M.npc.x === nx && M.npc.y === ny) {
        stopAutoWalk();
        if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
        Sfx.coin();
        startDialogue(cur.intro, () => startEncounter(), cur.type === 'battle' ? '進入戰鬥 ⚔️' : '開始考驗 📝');
        return false;
      }
      stepsSinceEvent++;
      if (!loot && maybeRandomEvent()) return false;
      renderForestMap();
      return true;
    }

    // =========================================================================
    // 走路隨機遭遇：野外小考驗 或 野生動物
    // =========================================================================
    function maybeRandomEvent() {
      const d = cur.diff;
      const cooldown = Math.max(3, 6 - Math.floor(d.tier / 3));
      if (stepsSinceEvent < cooldown) return false;
      const chance = Math.min(0.32, (game === 'endless' ? 0.16 : 0.1) + d.tier * 0.012);
      if (Math.random() >= chance) return false;
      stepsSinceEvent = 0;
      stopAutoWalk();
      if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
      Sfx.bump();
      if (!reducedMotion) replayAnim(mapGridEl, 'shake');
      // 先閃一下地圖，再進入事件
      mode = 'event-intro';
      const isBattle = Math.random() < 0.4;
      $('map-quest-hint').textContent = isBattle ? '❗ 草叢裡衝出了野生動物！' : '❗ 發生了一件事……';
      renderForestMap();
      setTimeout(() => {
        if (mode !== 'event-intro') return;
        isBattle ? startWildBattle() : startWildQuiz();
      }, 650);
      return true;
    }

    function wildReward() {
      const opts = [];
      if (P.honey < 5) opts.push(() => { P.honey++; return '🍯 獲得森林蜂蜜 +1'; });
      if (P.hp < P.maxHp) opts.push(() => { const b = P.hp; P.hp = Math.min(P.maxHp, P.hp + 15); return `💚 體力恢復 ${P.hp - b} HP`; });
      opts.push(() => { P.atk += 1; return '⚔️ 勇氣 +1'; });
      opts.push(() => { P.def += 1; return '🛡️ 智慧 +1'; });
      const msg = opts[Math.floor(Math.random() * opts.length)]();
      updateHud();
      saveProgress();
      return msg;
    }

    function startWildQuiz() {
      mode = 'event';
      hideAllPanels();
      showPanel(quizPanel);
      const cat = Object.keys(EVENT_FLAVOR)[Math.floor(Math.random() * Object.keys(EVENT_FLAVOR).length)];
      const q = pickQuestions([cat], cur.diff.qLevel, 1)[0];
      const fl = EVENT_FLAVOR[cat];
      askQuestion(q, {
        progress: '🎲 野外小考驗',
        barPct: 0,
        intro: { icon: fl.icon, text: fl.text + ' 答對有獎勵！' },
        timeLimit: cur.diff.timeLimit,
        onAnswer: (correct) => {
          let msg, dead = false;
          if (correct) {
            const reward = wildReward();
            msg = '✅ 答對了！' + reward;
            if (run) run.solved++;
            $('quiz-feedback').textContent += '　' + reward;
          } else {
            const pen = Math.ceil(cur.diff.penalty / 2);
            P.hp = game === 'story' ? Math.max(10, P.hp - pen) : Math.max(0, P.hp - pen);
            updateHud();
            $('quiz-feedback').textContent += `（HP -${pen}）`;
            dead = P.hp <= 0;
            msg = `❌ 答錯了，HP -${pen}，下次加油！`;
          }
          setTimeout(() => {
            if (mode !== 'event') return;
            if (dead) runOver('在野外考驗中體力耗盡');
            else backToMap(msg);
          }, correct ? 1300 : 2000);
        }
      });
    }

    function startWildBattle() {
      const t = cur.diff.tier;
      const base = WILD_FOES[Math.floor(Math.random() * WILD_FOES.length)];
      startBattle({ ...base, name: `野生・${base.name}`, hp: 28 + t * 9, atk: 8 + Math.round(t * 1.6) }, 'wild');
    }

    // 地圖輸入
    mapGridEl.addEventListener('click', (e) => {
      if (swipeMoved) return;
      const btn = e.target.closest('[data-mx]');
      if (btn) walkToTile(parseInt(btn.dataset.mx, 10), parseInt(btn.dataset.my, 10));
    });
    mapGridEl.addEventListener('pointerdown', (e) => { swipeStart = { x: e.clientX, y: e.clientY }; swipeMoved = false; });
    mapGridEl.addEventListener('pointermove', (e) => {
      if (!swipeStart || mode !== 'map') return;
      const dx = e.clientX - swipeStart.x, dy = e.clientY - swipeStart.y;
      if (Math.hypot(dx, dy) >= 28) {
        swipeMoved = true;
        stopAutoWalk();
        if (Math.abs(dx) > Math.abs(dy)) moveMapPlayer(dx > 0 ? 1 : -1, 0);
        else moveMapPlayer(0, dy > 0 ? 1 : -1);
        swipeStart = { x: e.clientX, y: e.clientY };
      }
    });
    const endSwipe = () => { swipeStart = null; setTimeout(() => { swipeMoved = false; }, 50); };
    mapGridEl.addEventListener('pointerup', endSwipe);
    mapGridEl.addEventListener('pointercancel', endSwipe);
    mapGridEl.addEventListener('pointerleave', endSwipe);
    $('dpad').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-dir]');
      if (!btn) return;
      stopAutoWalk();
      const [dx, dy] = btn.dataset.dir.split(',').map(Number);
      moveMapPlayer(dx, dy);
    });

    // =========================================================================
    // 8. 共用問答介面（阻礙、問答關都用它）
    // =========================================================================
    let currentQ = null, quizLock = false, quizHandler = null;
    let quizTimer = null, quizDeadline = 0;

    function stopQuizTimer() { if (quizTimer) { clearInterval(quizTimer); quizTimer = null; } }

    function askQuestion(q, { progress, barPct, intro, timeLimit, onAnswer }) {
      currentQ = shuffleOpts(q);
      quizLock = false;
      quizHandler = onAnswer;
      $('quiz-tag').textContent = currentQ.tag + (q.retry ? '・再挑戰' : '');
      $('quiz-progress').textContent = progress;
      $('quiz-bar').style.width = `${barPct}%`;
      $('quiz-q').textContent = currentQ.q;
      $('quiz-feedback').textContent = '';
      const introBox = $('quiz-intro');
      introBox.classList.toggle('hidden', !intro);
      introBox.classList.toggle('flex', !!intro);
      if (intro) { $('quiz-intro-icon').textContent = intro.icon; $('quiz-intro-text').textContent = intro.text; }

      const optsBox = $('quiz-opts');
      optsBox.innerHTML = currentQ.opts.map((opt, i) => `
        <button data-qopt="${i}" type="button" class="w-full text-left p-3.5 rounded-xl border-2 border-emerald-800/20 bg-emerald-50/70 hover:bg-amber-100 active:scale-[0.99] text-base font-bold text-gray-900 transition">
          ${'ABC'[i]}. ${escapeHtml(opt)}
        </button>`).join('');
      if (!reducedMotion) replayAnim(optsBox, 'pop-in');

      stopQuizTimer();
      const tw = $('quiz-timer-wrap');
      tw.classList.toggle('hidden', !timeLimit);
      tw.classList.toggle('flex', !!timeLimit);
      if (timeLimit) {
        quizDeadline = Date.now() + timeLimit * 1000;
        let lastSec = timeLimit;
        const tick = () => {
          const left = Math.max(0, quizDeadline - Date.now());
          const sec = Math.ceil(left / 1000);
          $('quiz-timer-txt').textContent = sec;
          $('quiz-timer-bar').style.width = `${(left / (timeLimit * 1000)) * 100}%`;
          if (sec !== lastSec && sec <= 3 && sec > 0) Sfx.tick();
          lastSec = sec;
          if (left <= 0) { stopQuizTimer(); answerQuiz(-1); }
        };
        tick();
        quizTimer = setInterval(tick, 100);
      }
    }

    function answerQuiz(pick) {
      if (quizLock || !['quiz', 'obstacle', 'event'].includes(mode) || !currentQ) return;
      if (pick >= currentQ.opts.length) return;
      quizLock = true;
      stopQuizTimer();
      const q = currentQ;
      const correct = pick === q.ans;
      const buttons = $('quiz-opts').querySelectorAll('[data-qopt]');
      buttons.forEach(b => { b.disabled = true; });
      buttons[q.ans].classList.add('bg-emerald-200', 'border-emerald-600');
      const fb = $('quiz-feedback');
      if (correct) {
        Sfx.coin();
        fb.className = 'text-sm font-bold text-emerald-700 min-h-[22px]';
        fb.textContent = '✅ 答對了！真厲害！';
      } else {
        Sfx.hit();
        if (pick >= 0) buttons[pick].classList.add('bg-rose-200', 'border-rose-500');
        fb.className = 'text-sm font-bold text-rose-700 min-h-[22px]';
        fb.textContent = `${pick < 0 ? '⏰ 時間到！' : '❌'} 正確答案是：${q.opts[q.ans]}`;
        if (!reducedMotion) replayAnim($('stage-area'), 'flash-red');
      }
      quizHandler(correct, q);
    }

    // 答錯扣血：故事模式最低留 10 HP；連續闖關可能倒下
    function quizPenalty(extraMsg) {
      const pen = cur.diff.penalty;
      P.hp = game === 'story' ? Math.max(10, P.hp - pen) : Math.max(0, P.hp - pen);
      updateHud();
      const fb = $('quiz-feedback');
      fb.textContent += `（HP -${pen}${extraMsg || ''}）`;
      return P.hp <= 0;
    }

    $('quiz-opts').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-qopt]');
      if (btn) answerQuiz(parseInt(btn.dataset.qopt, 10));
    });

    // ---- 阻礙 ----
    let activeObstacle = null;
    function startObstacle(ob) {
      mode = 'obstacle';
      activeObstacle = ob;
      hideAllPanels();
      showPanel(quizPanel);
      askObstacleQuestion();
    }
    function askObstacleQuestion(retry) {
      const ob = activeObstacle;
      const q = pickQuestions([ob.cat], cur.diff.qLevel, 1)[0];
      const left = M.obstacles.filter(o => !o.cleared).length;
      askQuestion({ ...q, retry }, {
        progress: `${ob.icon} 阻礙 ${M.obstacles.length - left + 1}/${M.obstacles.length}`,
        barPct: ((M.obstacles.length - left) / M.obstacles.length) * 100,
        intro: { icon: ob.icon, text: `【${ob.name}】${ob.intro}` },
        timeLimit: cur.diff.timeLimit,
        onAnswer: (correct) => {
          if (correct) {
            ob.cleared = true;
            if (run) run.solved++;
            setTimeout(() => {
              if (mode !== 'obstacle') return;
              mapPlayer = { x: ob.x, y: ob.y };
              revealAround(ob.x, ob.y);
              backToMap(ob.win);
            }, 850);
          } else {
            const dead = quizPenalty('，換一題再試');
            setTimeout(() => {
              if (mode !== 'obstacle') return;
              if (dead) runOver('在阻礙前體力耗盡');
              else askObstacleQuestion(true);
            }, 1900);
          }
        }
      });
    }

    // ---- 問答關（答錯的題目排到最後重考）----
    let quizQueue = [], quizTotal = 0, quizScore = 0, quizMistakes = 0;
    function startQuiz() {
      mode = 'quiz';
      quizScore = 0;
      quizMistakes = 0;
      quizQueue = shuffle(cur.questions);
      quizTotal = quizQueue.length;
      showPanel(quizPanel);
      askNextQuiz();
    }
    function askNextQuiz() {
      askQuestion(quizQueue[0], {
        progress: `答對 ${quizScore} / ${quizTotal}`,
        barPct: (quizScore / quizTotal) * 100,
        intro: null,
        timeLimit: cur.diff.timeLimit,
        onAnswer: (correct) => {
          const q = quizQueue.shift();
          let dead = false;
          if (correct) quizScore++;
          else {
            quizMistakes++;
            quizQueue.push({ ...q, retry: true });
            dead = quizPenalty('，這題稍後再考');
          }
          $('quiz-progress').textContent = `答對 ${quizScore} / ${quizTotal}`;
          $('quiz-bar').style.width = `${(quizScore / quizTotal) * 100}%`;
          setTimeout(() => {
            if (mode !== 'quiz') return;
            if (dead) runOver('在長老的考驗中體力耗盡');
            else if (quizScore >= quizTotal) completeStage();
            else askNextQuiz();
          }, correct ? 900 : 1900);
        }
      });
    }

    // =========================================================================
    // 9. 回合制戰鬥
    // =========================================================================
    const SKILL_CHARGE = 3;
    let enemyHp = 50, enemyMaxHp = 50, defending = false, battleLock = false;
    let skillCharge = 0, enemyCharged = false, battleTurns = 0;
    let foe = null, foeKind = 'stage';

    function startEncounter() {
      if (cur.type === 'battle') startBattle(cur.enemy, 'stage');
      else { hideAllPanels(); startQuiz(); }
    }

    function startBattle(enemy, kind) {
      hideAllPanels();
      foe = enemy;
      foeKind = kind;
      {
        mode = 'battle';
        enemyHp = enemyMaxHp = foe.hp;
        defending = false;
        battleLock = false;
        skillCharge = 1;
        enemyCharged = false;
        battleTurns = 0;
        $('enemy-icon').textContent = foe.icon;
        $('enemy-name').textContent = foe.name;
        $('battle-log').textContent = kind === 'wild' ? `草叢裡衝出「${foe.name}」！打贏有獎勵！` : `遭遇「${foe.name}」！請選擇你的行動！`;
        updateBattleUI();
        showPanel(battlePanel);
      }
    }

    function wildWin() {
      mode = 'event';
      Sfx.win();
      const msg = wildReward();
      if (run) run.solved++;
      backToMap(`🏆 打贏了 ${foe.name}！${msg}`);
    }

    function updateBattleUI() {
      $('enemy-hp-txt').textContent = `敵方體力 ${Math.max(0, enemyHp)} / ${enemyMaxHp}`;
      $('enemy-hp-bar').style.width = `${Math.max(0, Math.round((enemyHp / enemyMaxHp) * 100))}%`;
      const intent = $('enemy-intent');
      intent.textContent = enemyCharged ? '⚡ 蓄力中！下回合重擊' : `⚔️ 攻擊力 ${foe.atk}`;
      intent.className = enemyCharged ? 'text-amber-600 animate-pulse' : 'text-gray-500';
      const ready = skillCharge >= SKILL_CHARGE;
      const skillBtn = $('act-skill');
      skillBtn.textContent = ready ? '🐾 小隊支援 ✨' : `🐾 小隊支援 (${skillCharge}/${SKILL_CHARGE})`;
      ['act-atk', 'act-def'].forEach(id => { $(id).disabled = battleLock; });
      skillBtn.disabled = battleLock || !ready;
      updateHud();
      $('act-heal').disabled = battleLock || P.honey <= 0 || P.hp >= P.maxHp;
    }

    function floatText(text, color) {
      if (reducedMotion) return;
      const el = document.createElement('div');
      el.className = 'dmg-float';
      el.style.color = color;
      el.style.left = `${40 + Math.random() * 20}%`;
      el.textContent = text;
      $('enemy-float-layer').appendChild(el);
      setTimeout(() => el.remove(), 950);
    }

    function playerBattleTurn(action) {
      if (mode !== 'battle' || battleLock) return;
      const logEl = $('battle-log');
      if (action === 'skill' && skillCharge < SKILL_CHARGE) return;
      if (action === 'heal' && P.honey <= 0) { Sfx.bump(); logEl.textContent = '🍯 森林蜂蜜已經用完了！請選其他行動！'; return; }

      battleLock = true;
      defending = false;
      battleTurns++;
      const enemyCard = $('enemy-card');

      if (action === 'atk') {
        const crit = Math.random() < 0.15;
        let dmg = P.atk + Math.floor(Math.random() * 8);
        if (crit) dmg = Math.round(dmg * 1.6);
        enemyHp = Math.max(0, enemyHp - dmg);
        skillCharge = Math.min(SKILL_CHARGE, skillCharge + 1);
        crit ? Sfx.crit() : Sfx.coin();
        logEl.textContent = crit ? `💥 會心一擊！毛克利造成 ${dmg} 點傷害！` : `🐺 毛克利勇氣出擊，造成 ${dmg} 點傷害！`;
        floatText(crit ? `-${dmg}!!` : `-${dmg}`, crit ? '#d97706' : '#e11d48');
        if (!reducedMotion) replayAnim(enemyCard, 'shake');
      } else if (action === 'skill') {
        const dmg = Math.round(P.atk * 1.8) + P.level * 2 + Math.floor(Math.random() * 6);
        enemyHp = Math.max(0, enemyHp - dmg);
        skillCharge = 0;
        const interrupted = enemyCharged;
        enemyCharged = false;
        Sfx.win();
        logEl.textContent = `🐾 狼群與夥伴聯手支援，造成 ${dmg} 點強力傷害！${interrupted ? '成功打斷蓄力！' : ''}`;
        floatText(`-${dmg}`, '#d97706');
        if (!reducedMotion) replayAnim(enemyCard, 'shake');
      } else if (action === 'def') {
        defending = true;
        P.hp = Math.min(P.maxHp, P.hp + 10);
        skillCharge = Math.min(SKILL_CHARGE, skillCharge + 1);
        Sfx.blip();
        logEl.textContent = '🛡️ 遵守叢林規律穩住陣腳，減傷並恢復 10 HP！';
      } else if (action === 'heal') {
        P.honey--;
        const before = P.hp;
        P.hp = Math.min(P.maxHp, P.hp + 40);
        Sfx.coin();
        logEl.textContent = `🍯 喝下森林蜂蜜，體力恢復 ${P.hp - before} HP！`;
      }
      updateBattleUI();

      if (enemyHp <= 0) {
        $('enemy-icon').textContent = '💫';
        setTimeout(() => { if (mode === 'battle') (foeKind === 'wild' ? wildWin() : completeStage()); }, 800);
        return;
      }
      setTimeout(enemyTurn, 700);
    }

    function enemyTurn() {
      if (mode !== 'battle') return;
      const logEl = $('battle-log');
      const en = foe;
      if (!enemyCharged && battleTurns >= 2 && Math.random() < cur.diff.chargeChance) {
        enemyCharged = true;
        Sfx.bump();
        logEl.textContent = `⚡ ${en.name} 正在蓄力！下回合會重擊，快防禦或用小隊支援打斷！`;
        battleLock = false;
        updateBattleUI();
        return;
      }
      const heavy = enemyCharged;
      enemyCharged = false;
      let dmg = Math.max(4, en.atk + Math.floor(Math.random() * 5) - Math.floor(P.def / 3));
      if (heavy) dmg = Math.round(dmg * 1.8);
      if (defending) dmg = Math.max(2, Math.floor(dmg * (heavy ? 0.25 : 0.4)));
      P.hp = Math.max(0, P.hp - dmg);
      Sfx.hit();
      logEl.textContent = heavy
        ? `💢 ${en.name} 重擊！${defending ? '幸好有防禦，' : ''}毛克利受到 ${dmg} 點傷害！`
        : `💥 ${en.name} 反擊！毛克利受到 ${dmg} 點傷害！`;
      if (!reducedMotion) replayAnim($('stage-area'), 'flash-red');

      if (P.hp <= 0) {
        updateBattleUI();
        setTimeout(() => {
          if (game === 'endless') { runOver(`被 ${en.name} 打倒了`); return; }
          mode = 'gameover';
          if (foeKind === 'wild') {
            showOverlay({
              icon: '😵', chapter: cur.chapter, title: `被${en.name}打敗了！`,
              sub: '伯魯把你背回安全的地方休息。補滿體力，繼續探索吧！',
              buttons: [
                { text: '補滿體力繼續探索 🌲', onClick: () => { P.hp = P.maxHp; P.honey = Math.max(2, P.honey); overlay.classList.add('hidden'); backToMap('💪 體力恢復了，繼續前進！'); } },
                { text: '回到標題', onClick: goTitle }
              ]
            });
            return;
          }
          showOverlay({
            icon: '😵', chapter: cur.chapter, title: '體力耗盡了！',
            sub: '阿克拉扶起你：小狼不怕困難，補滿體力再挑戰一次！',
            buttons: [
              { text: '補滿體力接關 🔄', onClick: () => { P.hp = P.maxHp; P.honey = Math.max(2, P.honey); updateHud(); startEncounter(); } },
              { text: '回到標題', onClick: goTitle }
            ]
          });
        }, 700);
        return;
      }
      battleLock = false;
      updateBattleUI();
    }

    // =========================================================================
    // 10. 關卡設定：故事模式 / 連續闖關
    // =========================================================================
    function buildStoryStage(idx) {
      const st = STAGES[idx];
      const d = { ...difficulty() };
      const c = {
        chapter: st.chapter, emoji: st.emoji, type: st.type, intro: st.intro,
        npc: CHAPTER_NPCS[idx],
        mapTitle: `🌲 第 ${idx + 1} 篇`,
        accent: (idx === 3 || idx === 9) ? 2 : (idx === 0 || idx === 8 || idx === 10) ? 3 : 4,
        diff: d
      };
      if (st.type === 'battle') c.enemy = { ...st.enemy };
      else {
        const need = 3 + Math.floor(idx / 4);
        const base = st.questions.map(q => ({ ...q }));
        const extras = pickQuestions(['badge', 'promise'], d.qLevel, need - base.length, base.map(q => q.q));
        c.questions = [...base, ...extras];
      }
      return c;
    }

    function buildEndlessStage(r) {
      const d = difficulty();
      const boss = r % 5 === 0;
      const isBattle = boss || r % 2 === 1;
      const npc = CHAPTER_NPCS[(r - 1) % CHAPTER_NPCS.length];
      const c = {
        chapter: `🔥 連續闖關・第 ${r} 關${boss ? '（頭目關）' : ''}`,
        emoji: boss ? '🐯' : isBattle ? '⚔️' : '📜',
        type: isBattle ? 'battle' : 'quiz',
        npc,
        mapTitle: `🔥 第 ${r} 關`,
        accent: [2, 3, 4][r % 3],
        diff: d,
        intro: [{ av: npc.icon, sp: npc.name, txt: ENDLESS_LINES[(r - 1) % ENDLESS_LINES.length] }]
      };
      if (isBattle) {
        const base = boss ? { name: `頭目・瘸老虎 邪漢（第 ${r / 5} 次復仇）`, icon: '🐯' } : ENDLESS_ENEMIES[Math.floor(Math.random() * ENDLESS_ENEMIES.length)];
        c.enemy = {
          ...base,
          hp: Math.round((70 + r * 15) * (boss ? 1.5 : 1)),
          atk: Math.round(13 + r * 2.2 + (boss ? 3 : 0))
        };
        c.intro.push({ av: base.icon, sp: base.name, txt: boss ? '「吼！這次我不會再輸給你了！」' : '「站住！想通過這裡，先打贏我！」' });
      } else {
        const need = Math.min(8, 3 + Math.floor(r / 2));
        c.questions = pickQuestions(null, d.qLevel, need);
        c.intro.push({ av: '📜', sp: '長老的考驗', txt: `「答對 ${need} 題幼童軍知識才能過關，每題限時 ${d.timeLimit} 秒！」` });
      }
      return c;
    }

    function startChapter(idx) {
      game = 'story';
      P = state;
      state.stageIdx = idx;
      saveProgress();
      cur = buildStoryStage(idx);
      enterMap();
    }

    function startEndless() {
      game = 'endless';
      run = freshRun();
      P = run;
      usedQ.clear();
      startEndlessRound();
    }
    function startEndlessRound() {
      cur = buildEndlessStage(run.round);
      enterMap();
    }

    // =========================================================================
    // 11. 過關、結算
    // =========================================================================
    function completeStage() {
      if (mode === 'stage-clear') return;
      mode = 'stage-clear';
      stopQuizTimer();
      Sfx.win();
      if (game === 'endless') return completeEndlessRound();

      const st = STAGES[state.stageIdx];
      const perfect = st.type === 'quiz' && quizMistakes === 0;
      state.cleared[state.stageIdx] = true;
      state.level = Math.min(STAGES.length + 1, state.level + 1);
      state.maxHp += 10;
      state.hp = state.maxHp;
      state.atk += 3;
      state.def += 2;
      state.honey = Math.min(5, state.honey + (perfect ? 2 : 1));
      if (!state.bag.some(b => b.name === st.reward.name)) state.bag.push(st.reward);
      const isLast = state.stageIdx >= STAGES.length - 1;
      if (!isLast) state.stageIdx++;
      saveProgress();
      updateHud();

      startDialogue([
        ...st.outro,
        { av: st.reward.icon, sp: '升級獎勵', txt: `升到 Lv.${state.level}！HP 上限 +10、勇氣 +3、智慧 +2，獲得【${st.reward.name}】！${perfect ? '全對獎勵：蜂蜜 +2！' : ''}` }
      ], () => {
        if (isLast) showVictory();
        else startChapter(state.stageIdx);
      }, isLast ? '完成冒險 👑' : '前往下一篇 ▶');
    }

    function completeEndlessRound() {
      const r = run.round;
      if (r > bestRound) { bestRound = r; saveBest(); }
      run.level++;
      run.maxHp += 6;
      run.atk += 2;
      run.def += 1;
      const heal = Math.round(run.maxHp * 0.35);
      run.hp = Math.min(run.maxHp, run.hp + heal);
      run.honey = Math.min(5, run.honey + 1);
      run.round++;
      updateHud();
      const next = difficulty();
      startDialogue([
        { av: '🏆', sp: `第 ${r} 關完成！`, txt: `勇氣 +2、智慧 +1、HP 上限 +6，恢復 ${heal} HP，蜂蜜 +1。${r === bestRound ? '🎉 刷新最佳紀錄！' : ''}` },
        { av: '⚠️', sp: '下一關預告', txt: `第 ${run.round} 關：迷宮 ${next.mapN}×${next.mapN}、${next.obstacles} 個阻礙、題目難度 ${'★'.repeat(next.qLevel)}、限時 ${next.timeLimit} 秒。體力不會全部恢復，小心前進！` }
      ], startEndlessRound, '挑戰下一關 🔥');
    }

    function runOver(reason) {
      mode = 'gameover';
      const reached = run.round;
      const cleared = reached - 1;
      showOverlay({
        icon: '🏕️', chapter: `連續闖關・${reason}`,
        title: `闖過 ${cleared} 關！`,
        sub: `這次挑戰到第 ${reached} 關，通過 ${run.solved} 個阻礙。最佳紀錄：第 ${bestRound} 關。小狼不怕困難，再試一次吧！`,
        buttons: [
          { text: '🔥 再挑戰一次', style: 'fire', onClick: startEndless },
          { text: '回到標題', onClick: goTitle }
        ]
      });
    }

    function showVictory() {
      mode = 'victory';
      showOverlay({
        icon: '👑', chapter: `《叢林奇談》${STAGES.length} 篇全破`,
        title: `Lv.${state.level} 傳奇小狼・毛克利`,
        sub: `你收集了 ${state.bag.length} 枚徽章！接下來挑戰「連續闖關」，看看你能撐到第幾關！`,
        buttons: [
          { text: `🔥 挑戰連續闖關${bestRound ? `（最佳 ${bestRound}）` : ''}`, style: 'fire', onClick: startEndless },
          { text: '📖 閱讀故事書', style: 'secondary', noMusic: true, onClick: openFullStory },
          { text: '從頭重溫故事 🔄', confirm: true, onClick: () => { resetState(); updateHud(); startChapter(0); } }
        ]
      });
    }

    function goTitle() {
      stopAutoWalk();
      stopQuizTimer();
      closeModals();
      game = 'story';
      P = state;
      run = null;
      mode = 'title';
      updateHud();
      if (allCleared()) { showVictory(); return; }
      const hasSave = state.stageIdx > 0 || state.cleared.some(Boolean);
      const endlessBtn = { text: `🔥 連續闖關模式${bestRound ? `（最佳 ${bestRound}）` : ''}`, style: 'fire', onClick: startEndless };
      if (hasSave) {
        showOverlay({
          icon: '🐺', chapter: `已記錄進度：第 ${state.stageIdx + 1} 篇`,
          title: '叢林奇談 RPG',
          sub: `上次冒險到「${STAGES[state.stageIdx].chapter}」。也可以挑戰越來越難的連續闖關！`,
          buttons: [
            { text: `繼續故事 (第 ${state.stageIdx + 1} 篇) ▶️`, onClick: () => startChapter(state.stageIdx) },
            endlessBtn,
            { text: '📖 閱讀故事書', style: 'secondary', noMusic: true, onClick: openFullStory },
            { text: '從第 1 篇重新開始 🔄', confirm: true, onClick: () => { resetState(); updateHud(); startChapter(0); } }
          ]
        });
      } else {
        showOverlay({
          icon: '🐺', chapter: '幼童軍 × 叢林奇談',
          title: '叢林奇談：毛克利的冒險',
          sub: '探索迷宮、走路會遇到隨機考驗和野生動物、用幼童軍知識突破阻礙，收集 12 枚徽章！',
          buttons: [
            { text: '開始故事冒險 🚀', onClick: () => startChapter(0) },
            endlessBtn
          ]
        });
      }
    }

    // =========================================================================
    // 12. 榮譽帶與故事書
    // =========================================================================
    function openBagModal() {
      Sfx.blip();
      stopAutoWalk();
      const list = $('bag-list');
      const statLine = `
        <div class="p-3.5 rounded-xl bg-amber-500/15 border border-amber-400/30 text-xs text-amber-200 flex justify-between gap-2">
          <span>🍯 森林蜂蜜：<strong>${P.honey} / 5 罐</strong>（戰鬥中補 40 HP）</span>
          <span class="shrink-0">⚔️ ${P.atk}　🛡️ ${P.def}</span>
        </div>`;
      if (game === 'endless') {
        list.innerHTML = statLine + `
          <div class="p-4 rounded-xl bg-white/10 border border-white/15 text-sm space-y-1.5">
            <div class="font-black text-amber-300">🔥 連續闖關紀錄</div>
            <div>目前：第 ${run.round} 關</div>
            <div>已通過阻礙：${run.solved} 個</div>
            <div>最佳紀錄：第 ${bestRound} 關</div>
          </div>`;
      } else {
        const badges = state.bag.length
          ? state.bag.map(item => `
            <div class="p-3.5 rounded-xl bg-white/10 border border-white/15 flex items-center gap-3">
              <span class="text-3xl shrink-0">${escapeHtml(item.icon)}</span>
              <div>
                <div class="font-black text-sm text-amber-300">${escapeHtml(item.name)}</div>
                <div class="text-xs text-emerald-100/90 mt-0.5">${escapeHtml(item.desc)}</div>
              </div>
            </div>`).join('')
          : '<div class="p-4 text-center text-sm text-emerald-100/80">還沒有徽章，完成第一篇就能拿到第一枚！</div>';
        const locked = STAGES.length - state.bag.length;
        list.innerHTML = statLine + badges + (locked > 0 ? `<div class="text-center text-xs text-emerald-100/60 pt-1">還有 ${locked} 枚徽章等你解鎖 🔒</div>` : '');
      }
      bagModal.classList.remove('hidden');
      bagModal.classList.add('flex');
    }
    function closeModals() {
      [bagModal, storyModal].forEach(m => { m.classList.add('hidden'); m.classList.remove('flex'); });
    }
    function openFullStory() {
      Sfx.blip();
      $('story-content').innerHTML = STAGES.map((st, i) => {
        const unlocked = state.cleared[i];
        const lines = unlocked
          ? [...st.intro, ...st.outro].map(l => `<p class="text-base text-gray-800 leading-relaxed"><span class="font-bold text-emerald-900">${l.av} ${escapeHtml(l.sp)}：</span>${escapeHtml(l.txt)}</p>`).join('')
          : '<p class="text-sm text-gray-500">🔒 完成這一篇冒險後解鎖</p>';
        return `
          <article class="p-4 rounded-2xl bg-white border-2 border-emerald-900/15 shadow-sm space-y-2 ${unlocked ? '' : 'opacity-60'}">
            <div class="flex items-center gap-2 border-b border-amber-200 pb-2">
              <span class="text-2xl">${unlocked ? st.emoji : '🔒'}</span>
              <h3 class="font-black text-base text-emerald-950">${escapeHtml(st.chapter)}</h3>
            </div>
            <div class="space-y-1.5">${lines}</div>
          </article>`;
      }).join('');
      storyModal.classList.remove('hidden');
      storyModal.classList.add('flex');
    }

    // =========================================================================
    // 13. 事件綁定與初始化
    // =========================================================================
    $('act-atk').addEventListener('click', () => playerBattleTurn('atk'));
    $('act-skill').addEventListener('click', () => playerBattleTurn('skill'));
    $('act-def').addEventListener('click', () => playerBattleTurn('def'));
    $('act-heal').addEventListener('click', () => playerBattleTurn('heal'));
    $('btn-bag').addEventListener('click', openBagModal);
    $('btn-close-bag').addEventListener('click', closeModals);
    $('btn-close-story').addEventListener('click', closeModals);

    const homeBtn = $('btn-home');
    let homeArmed = false;
    homeBtn.addEventListener('click', () => {
      if (mode === 'title' || mode === 'victory') return;
      if (!homeArmed) {
        homeArmed = true;
        homeBtn.textContent = game === 'endless' ? '放棄？' : '回標題？';
        setTimeout(() => { homeArmed = false; homeBtn.textContent = '🏠'; }, 2500);
        return;
      }
      homeArmed = false;
      homeBtn.textContent = '🏠';
      goTitle();
    });

    window.addEventListener('keydown', (e) => {
      const modalOpen = !bagModal.classList.contains('hidden') || !storyModal.classList.contains('hidden');
      if (e.key === 'Escape' && modalOpen) { closeModals(); return; }
      if (modalOpen || (e.repeat && mode !== 'map')) return;
      if (mode === 'map') {
        const dirs = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] };
        const dir = dirs[e.key.toLowerCase()];
        if (dir) { e.preventDefault(); stopAutoWalk(); moveMapPlayer(...dir); }
      } else if (mode === 'dialogue') {
        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); advanceDialogue(); }
      } else if (mode === 'battle') {
        const acts = { '1': 'atk', '2': 'skill', '3': 'def', '4': 'heal' };
        if (acts[e.key]) playerBattleTurn(acts[e.key]);
      } else if (mode === 'quiz' || mode === 'obstacle' || mode === 'event') {
        const idx = { '1': 0, '2': 1, '3': 2, a: 0, b: 1, c: 2 }[e.key.toLowerCase()];
        if (idx !== undefined) answerQuiz(idx);
      }
    });

    const soundBtn = $('btn-sound');
    soundBtn.textContent = Sfx.enabled ? '🔊' : '🔇';
    soundBtn.addEventListener('click', () => { soundBtn.textContent = Sfx.toggle() ? '🔊' : '🔇'; });

    (function boot() {
      const saved = loadProgress();
      if (saved) { state = saved; P = state; }
      goTitle();
    })();
  </script>
</body>
</html>
