<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>LINE 圖文選單設計稿</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<!--
  LINE 圖文選單（分頁版・活潑款）
  尺寸：2500 x 1686
  上方分頁列 0~280px（三等分：0 / 833 / 1666）
  下方按鈕 2 列 x 3 欄：y 280~983、983~1686
  ※ 座標要跟 richmenu.gs 一致；改完執行 node render.js 重出圖
-->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:2500px;height:1686px;overflow:hidden;
    font-family:"Noto Sans TC","Noto Color Emoji",sans-serif;color:#2a2a2a;background:#fff}
  .emo{font-family:"Noto Color Emoji";line-height:1}

  /* ===== 分頁列 ===== */
  .tabs{position:absolute;left:0;top:0;width:2500px;height:280px;display:flex;background:#fff4e2}
  .tab{position:relative;width:833px;height:280px;display:flex;align-items:center;justify-content:center;gap:30px;padding-top:26px}
  .tab:last-child{width:834px}
  .tab .box{display:flex;align-items:center;gap:26px;padding:0 40px;height:200px;border-radius:60px;
    background:#fff;border:7px solid var(--c);box-shadow:0 12px 0 var(--c)}
  .tab .emo{font-size:96px}
  .tab .nm{font-size:84px;font-weight:900;color:var(--c);letter-spacing:2px;line-height:1.05}
  .tab .sub{font-size:44px;font-weight:700;color:#8a7a66;margin-top:8px;letter-spacing:1px}
  /* 目前所在分頁：實心 + 往下接到內容區 */
  .tab.on .box{background:var(--c);box-shadow:none;height:254px;margin-top:26px;border-radius:60px 60px 0 0;padding-bottom:26px}
  .tab.on .nm{color:#fff}
  .tab.on .sub{color:rgba(255,255,255,.9)}
  .tab.on .box{border-bottom:none}
  .here{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:#2a2a2a;color:#fff;
    font-size:38px;font-weight:900;padding:6px 26px;border-radius:30px;letter-spacing:2px;z-index:3;white-space:nowrap}

  /* ===== 內容區 ===== */
  .panel{position:absolute;left:0;top:280px;width:2500px;height:1406px;background:radial-gradient(rgba(255,255,255,.16) 9px,transparent 10px) 0 0/90px 90px,var(--c);
    padding:28px 34px 40px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:30px 36px}
  .dots{position:absolute;inset:280px 0 0 0;opacity:.13;
    background-image:radial-gradient(#fff 9px,transparent 10px);background-size:90px 90px;pointer-events:none}
  .card{position:relative;background:#fff;border-radius:64px;box-shadow:0 16px 0 var(--dark);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:visible}
  .card .ic{width:260px;height:260px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center}
  .card .ic .emo{font-size:160px}
  .card .t{font-size:100px;font-weight:900;color:#262626;letter-spacing:3px;line-height:1.1;margin-top:8px}
  .card .go{margin-top:10px;font-size:52px;font-weight:900;color:#fff;background:var(--dark);
    padding:12px 46px;border-radius:50px;letter-spacing:2px}
  .card.hot{background:#fffbe6;outline:10px solid #ffd23f;outline-offset:-10px}
  .tag{position:absolute;top:-6px;right:28px;background:#ff4d6d;color:#fff;font-size:50px;font-weight:900;
    padding:12px 34px;border-radius:40px;transform:rotate(8deg);box-shadow:0 8px 0 #c9183a;letter-spacing:2px}
  .tag.y{background:#ffd23f;color:#5a3d00;box-shadow:0 8px 0 #d9a400}
</style>
</head>
<body>
<div class="tabs" id="tabs"></div>
<div class="panel" id="panel"></div>

<script>
// ===== 三個分頁（順序要跟 richmenu.gs 一致）=====
const TABS = [
  {emo:'🏡', nm:'老宅延壽',   sub:'補助怎麼拿', c:'#ff7a2f', dark:'#c4500f', soft:'#ffe6d3'},
  {emo:'💰', nm:'老屋創收',   sub:'老屋怎麼賺', c:'#1fb27a', dark:'#0c7d52', soft:'#d6f5e8'},
  {emo:'📣', nm:'追蹤包租翁', sub:'看更多內容', c:'#4a7dff', dark:'#2450c4', soft:'#dde7ff'},
];
// 每頁 6 顆：左上→右上→左下→右下；go = 按了會怎樣
const PAGES = [
  [
    {e:'✅', t:'補助快篩',   go:'30秒測 →', hot:true, tag:'免費'},
    {e:'🏢', t:'公寓補助',   go:'看項目 →'},
    {e:'🏠', t:'透天補助',   go:'看項目 →'},
    {e:'🎤', t:'報名講座',   go:'搶位子 →', tag:'熱門', y:true},
    {e:'📄', t:'官方簡報',   go:'下載 →'},
    {e:'🙋', t:'找專人問',   go:'馬上問 →'},
  ],
  [
    {e:'🔨', t:'翻新實例',   go:'看前後 →', hot:true},
    {e:'🔑', t:'出租規劃',   go:'看做法 →'},
    {e:'🧪', t:'甲醛檢測',   go:'預約 →', tag:'NEW'},
    {e:'📍', t:'到府勘查',   go:'預約 →'},
    {e:'🧮', t:'投報試算',   go:'算算看 →'},
    {e:'💡', t:'常見問題',   go:'快速看 →'},
  ],
  [
    {e:'🧵', t:'Threads',    go:'每日乾貨 →', hot:true},
    {e:'👍', t:'Facebook',   go:'按讚 →'},
    {e:'▶️', t:'YouTube',    go:'看影片 →'},
    {e:'📸', t:'Instagram',  go:'追蹤 →'},
    {e:'🌐', t:'官方網站',   go:'逛逛 →'},
    {e:'🎁', t:'分享好友',   go:'推薦 →', tag:'揪團', y:true},
  ],
];

const n = Number(new URLSearchParams(location.search).get('tab') || 1) - 1;
const cur = TABS[n];
document.documentElement.style.setProperty('--c', cur.c);
document.documentElement.style.setProperty('--dark', cur.dark);
document.documentElement.style.setProperty('--soft', cur.soft);

document.getElementById('tabs').innerHTML = TABS.map((t,i)=>`
  <div class="tab ${i===n?'on':''}" style="--c:${t.c}">
    ${i===n?'<div class="here">你在這裡</div>':''}
    <div class="box"><span class="emo">${t.emo}</span>
      <div><div class="nm">${t.nm}</div><div class="sub">${i===n?t.sub:t.sub+' ›'}</div></div></div>
  </div>`).join('');

document.getElementById('panel').innerHTML = PAGES[n].map(c=>`
  <div class="card ${c.hot?'hot':''}">
    ${c.tag?`<div class="tag ${c.y?'y':''}">${c.tag}</div>`:''}
    <div class="ic"><span class="emo">${c.e}</span></div>
    <div class="t">${c.t}</div>
    <div class="go">${c.go}</div>
  </div>`).join('');
</script>
</body>
</html>
